<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#F0F4F2"/>
  
  <!-- Main Card -->
  <rect x="40" y="80" width="320" height="440" rx="30" fill="white" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="0" y="0" width="400" height="600" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#2F3E46" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Logo Icon -->
  <rect x="170" y="120" width="60" height="60" rx="15" fill="#CAD2C5"/>
  <path d="M185 140C185 137.791 186.791 136 189 136H211C213.209 136 215 137.791 215 140V160C215 162.209 213.209 164 211 164H189C186.791 164 185 162.209 185 160V140Z" stroke="#52796F" stroke-width="2"/>
  <path d="M200 140V164" stroke="#52796F" stroke-width="2"/>

  <!-- Welcome Text -->
  <text x="200" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2F3E46">Welcome Back</text>
  <text x="200" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Please enter your details</text>

  <!-- Username Field -->
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Username</text>
  <rect x="60" y="290" width="280" height="45" rx="15" stroke="#CAD2C5" stroke-width="1.5" fill="none"/>
  <text x="75" y="318" font-family="Arial, sans-serif" font-size="12" fill="#A0A0A0">e.g. pooya.df</text>

  <!-- Password Field -->
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Password</text>
  <rect x="60" y="375" width="280" height="45" rx="15" stroke="#CAD2C5" stroke-width="1.5" fill="none"/>
  <text x="75" y="403" font-family="Arial, sans-serif" font-size="12" fill="#A0A0A0">••••••••</text>

  <!-- Login Button -->
  <rect x="60" y="445" width="280" height="50" rx="15" fill="#52796F"/>
  <text x="200" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Sign In</text>

  <!-- Footer Text -->
  <text x="200" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">Don't have an account? <tspan fill="#52796F" font-weight="bold">Create Account</tspan></text>
</svg>