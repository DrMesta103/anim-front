<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F0F4F2"/>

  <!-- SIDEBAR -->
  <rect width="260" height="800" fill="white"/>
  <rect x="259" y="0" width="1" height="800" fill="#CAD2C5"/> <!-- Border -->

  <!-- Logo -->
  <rect x="30" y="40" width="40" height="40" rx="10" fill="#CAD2C5"/>
  <path d="M42 52C42 50.8954 42.8954 50 44 50H56C57.1046 50 58 50.8954 58 52V68C58 69.1046 57.1046 70 56 70H44C42.8954 70 42 69.1046 42 68V52Z" stroke="#52796F" stroke-width="2"/>
  <text x="85" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">SageClinic</text>

  <!-- Sidebar Items -->
  <!-- Inactive State: Dashboard -->
  <text x="70" y="162" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#84A98C">Dashboard</text>
  <circle cx="45" cy="155" r="3" fill="#84A98C"/>

  <!-- Active State: Specialties -->
  <rect x="20" y="220" width="220" height="50" rx="12" fill="#52796F"/>
  <text x="70" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">Specialties</text>
  <circle cx="45" cy="245" r="3" fill="white"/>

  <!-- Other Items -->
  <text x="70" y="312" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Rooms</text>
  <text x="70" y="372" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Doctors</text>
  <text x="70" y="432" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Secretaries</text>

  <!-- TOP BAR -->
  <text x="290" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3E46">Specialties Management</text>
  <circle cx="1120" cy="55" r="20" fill="#CAD2C5"/>
  <text x="1020" y="60" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46" text-anchor="end">Pooya Admin</text>

  <!-- ACTION BAR -->
  <rect x="290" y="90" width="900" height="50" rx="15" fill="white" filter="url(#shadow)"/>
  <text x="315" y="120" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Search...</text>
  <rect x="1120" y="98" width="60" height="34" rx="8" fill="#52796F"/>
  <text x="1145" y="121" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">+ Add</text>

  <!-- MAIN CONTENT AREA -->
  <!-- Page Title -->
  <text x="290" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F3E46">All Specialties</text>

  <!-- Table Container -->
  <rect x="290" y="200" width="890" height="350" rx="30" fill="white" filter="url(#shadow)"/>

  <!-- Table Header -->
  <text x="320" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">ID</text>
  <text x="380" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Title</text>
  <text x="550" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Description</text>
  <text x="750" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Specialty Code</text>
  <text x="950" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Actions</text>

  <rect x="320" y="250" width="820" height="1" fill="#F0F4F2"/>

  <!-- Table Row 1 -->
  <text x="320" y="285" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">1</text>
  <text x="355" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Cardiology</text>
  <text x="550" y="285" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Heart and vascular health</text>
  <text x="750" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">CARD-001</text>

  <text x="950" y="285" font-family="Arial, sans-serif" font-size="14" fill="#52796F">✏️ 🗑️</text>

  <!-- Table Row 2 -->
  <text x="320" y="330" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">2</text>
  <text x="355" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Neurology</text>
<text x="550" y="330" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Brain and nervous system disorders</text>
  <text x="750" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">NEURO-002</text>
  <text x="950" y="330" font-family="Arial, sans-serif" font-size="14" fill="#52796F">✏️ 🗑️</text>

  <!-- Table Row 3 -->
  <text x="320" y="375" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">3</text>
  <text x="355" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Pediatrics</text>
  <text x="550" y="375" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Child and adolescent health</text>
  <text x="750" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">PED-003</text>
  <text x="950" y="375" font-family="Arial, sans-serif" font-size="14" fill="#52796F">✏️ 🗑️</text>

  <!-- Table Row 4 -->
  <text x="320" y="420" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">4</text>
  <text x="355" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Orthopedics</text>
  <text x="550" y="420" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Bone, joint, and muscle disorders</text>
  <text x="750" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">ORTHO-004</text>
  <text x="950" y="420" font-family="Arial, sans-serif" font-size="14" fill="#52796F">✏️ 🗑️</text>

  <!-- Table Row 5 -->
  <text x="320" y="465" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">5</text>
  <text x="355" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Dermatology</text>
  <text x="550" y="465" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Skin and cosmetic health</text>
  <text x="750" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">DERM-005</text>
  <text x="950" y="465" font-family="Arial, sans-serif" font-size="14" fill="#52796F">✏️ 🗑️</text>

  <!-- Shadow Filter Definition -->
  <defs>
    <filter id="shadow" x="0" y="0" width="1200" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#2F3E46" flood-opacity="0.05"/>
    </filter>
  </defs>
</svg>