<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F0F4F2"/>

  <!-- SIDEBAR -->
  <rect width="260" height="800" fill="white"/>
  <rect x="259" y="0" width="1" height="800" fill="#CAD2C5"/> <!-- Border -->

  <!-- Logo -->
  <rect x="30" y="40" width="40" height="40" rx="10" fill="#CAD2C5"/>
  <path d="M42 52C42 50.8954 42.8954 50 44 50H56C57.1046 50 58 50.8954 58 52V68C58 69.1046 57.1046 70 56 70H44C42.8954 70 42 69.1046 42 68V52Z" stroke="#52796F" stroke-width="2"/>
  <text x="85" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">SageClinic</text>

  <!-- Sidebar Items -->
  <!-- Inactive State: Dashboard -->
  <text x="70" y="162" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#84A98C">Dashboard</text>
  <circle cx="45" cy="155" r="3" fill="#84A98C"/>

  <!-- Inactive State: Specialties -->
  <text x="70" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#84A98C">Specialties</text>
  <circle cx="45" cy="245" r="3" fill="#84A98C"/>

  <!-- Active State: Rooms -->
  <rect x="20" y="310" width="220" height="50" rx="12" fill="#52796F"/>
  <text x="70" y="342" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">Rooms</text>
  <circle cx="45" cy="335" r="3" fill="white"/>

  <!-- Other Items -->
  <text x="70" y="402" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Doctors</text>
  <text x="70" y="462" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Secretaries</text>

  <!-- TOP BAR -->
  <text x="290" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3E46">Rooms Management</text>
  <circle cx="1120" cy="55" r="20" fill="#CAD2C5"/>

  <!-- ACTION BAR -->
  <rect x="290" y="90" width="900" height="50" rx="15" fill="white" filter="url(#shadow)"/>
  <text x="315" y="120" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Search...</text>
  <rect x="1120" y="98" width="60" height="34" rx="8" fill="#52796F"/>
  <text x="1145" y="121" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">+ Add</text>

  <!-- MAIN CONTENT AREA -->
  <!-- Page Title -->
  <text x="290" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F3E46">All Rooms</text>

  <!-- Table Container -->
  <rect x="290" y="200" width="890" height="350" rx="30" fill="white" filter="url(#shadow)"/>

  <!-- Table Header -->
  <text x="320" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">ID</text>
  <text x="380" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Room Name</text>
  <text x="550" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Description</text>
  <text x="750" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Floor</text>
  <text x="830" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Status</text>
  <text x="950" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Actions</text>

  <rect x="320" y="250" width="820" height="1" fill="#F0F4F2"/>

  <!-- Table Row 1 -->
  <text x="320" y="285" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">1</text>
  <text x="365" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Consultation A</text>
  <text x="550" y="285" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Main consultation room</text>
  <text x="750" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">0</text>
  <rect x="830" y="267" width="60" height="24" rx="12" fill="#52796F"/>

  <text x="845" y="284" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Active</text>
  <text x="950" y="285" font-family="Arial, sans-serif" font-size="14" fill="#52796F">✏️ 🗑️</text>

  <!-- Table Row 2 -->
  <text x="320" y="330" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">2</text>
  <text x="365" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Therapy Room 01</text>
    <text x="550" y="330" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Physical therapy area</text>
  <text x="750" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">1</text>
  <rect x="830" y="312" width="60" height="24" rx="12" fill="#52796F"/>
  <text x="845" y="329" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Active</text>
  <text x="950" y="330" font-family="Arial, sans-serif" font-size="14" fill="#52796F">✏️ 🗑️</text>

  <!-- Table Row 3 -->
  <text x="320" y="375" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">3</text>
  <text x="365" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Emergency Triage</text>
  <text x="550" y="375" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Urgent care intake</text>
  <text x="750" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">0</text>
  <rect x="830" y="357" width="60" height="24" rx="12" fill="#2F3E46"/>
  <text x="845" y="374" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Inactive</text>
  <text x="950" y="375" font-family="Arial, sans-serif" font-size="14" fill="#52796F">✏️ 🗑️</text>

  <!-- Table Row 4 -->
  <text x="320" y="420" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">4</text>
  <text x="365" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Surgery Prep</text>
  <text x="550" y="420" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Pre-operative preparation</text>
  <text x="750" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">2</text>
  <rect x="830" y="402" width="60" height="24" rx="12" fill="#52796F"/>
  <text x="845" y="419" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Active</text>
  <text x="950" y="420" font-family="Arial, sans-serif" font-size="14" fill="#52796F">✏️ 🗑️</text>

  <!-- Table Row 5 -->
  <text x="320" y="465" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">5</text>
  <text x="365" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Pharmacy Storage</text>
  <text x="550" y="465" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Medication dispensing</text>
  <text x="750" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">-1</text>
  <rect x="830" y="447" width="60" height="24" rx="12" fill="#52796F"/>
  <text x="845" y="464" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Active</text>
  <text x="950" y="465" font-family="Arial, sans-serif" font-size="14" fill="#52796F">✏️ 🗑️</text>

  <!-- Shadow Filter Definition -->
  <defs>
    <filter id="shadow" x="0" y="0" width="1200" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#2F3E46" flood-opacity="0.05"/>
    </filter>
  </defs>
</svg>