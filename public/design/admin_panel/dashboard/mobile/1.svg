<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Mobile Navbar -->
  <rect x="0" y="0" width="1200" height="70" fill="#ffffff"/>
  <rect x="0" y="70" width="1200" height="1" fill="#F0F4F2"/>

  <!-- Hamburger Menu Icon -->
  <path d="M 20 25 H 50 M 20 35 H 50 M 20 45 H 50" stroke="#2F3E46" stroke-width="3" stroke-linecap="round"/>

  <!-- Logo -->
  <text x="80" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#52796F">MedAdmin</text>

  <!-- Profile Avatar -->
  <circle cx="1160" cy="35" r="20" fill="#84A98C"/>
  <text x="1152" y="40" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">👨‍⚕️</text>

  <!-- Mobile Bottom Navigation Bar (Alternative) -->
  <rect x="0" y="730" width="1200" height="70" fill="#ffffff"/>
  <rect x="0" y="730" width="1200" height="1" fill="#F0F4F2"/>

  <!-- Bottom Nav Items -->
  <!-- Home Icon -->
  <rect x="80" y="740" width="200" height="50" rx="10" fill="white"/>
  <text x="90" y="772" font-family="Arial, sans-serif" font-size="24" fill="#52796F">🏠</text>
  <text x="95" y="788" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Home</text>

  <!-- Doctors Icon -->
  <rect x="290" y="740" width="200" height="50" rx="10" fill="white"/>
  <text x="300" y="772" font-family="Arial, sans-serif" font-size="24" fill="#52798C">👨‍⚕️</text>
  <text x="305" y="788" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Doctors</text>

  <!-- Patients Icon -->
  <rect x="500" y="740" width="200" height="50" rx="10" fill="white"/>
  <text x="510" y="772" font-family="Arial, sans-serif" font-size="24" fill="#52798C">👥</text>
  <text x="515" y="788" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Patients</text>

  <!-- Calendar Icon -->
  <rect x="710" y="740" width="200" height="50" rx="10" fill="white"/>
  <text x="720" y="772" font-family="Arial, sans-serif" font-size="24" fill="#52798C">📅</text>
  <text x="725" y="788" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Schedule</text>

  <!-- Settings Icon -->
  <rect x="920" y="740" width="200" height="50" rx="10" fill="white"/>
  <text x="930" y="772" font-family="Arial, sans-serif" font-size="24" fill="#52798C">⚙️</text>
  <text x="935" y="788" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Settings</text>

  <!-- Content Area (Adjusted for Mobile) -->
  <rect x="0" y="70" width="1200" height="660" fill="#F8F9FA"/>

  <!-- Card: Stats -->
  <rect x="20" y="90" width="560" height="150" rx="15" fill="white" filter="url(#shadow)"/>
  <text x="40" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Today's Appointments</text>
  <text x="40" y="155" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#52796F">28</text>
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">+5 from yesterday</text>

  <!-- Second Stat Card -->
  <rect x="600" y="90" width="560" height="150" rx="15" fill="white" filter="url(#shadow)"/>
  <text x="620" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Active Doctors</text>
  </svg>