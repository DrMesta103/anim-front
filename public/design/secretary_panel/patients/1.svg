<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F0F4F2"/>

  <!-- SIDEBAR -->
  <rect width="260" height="800" fill="white"/>
  <rect x="259" y="0" width="1" height="800" fill="#CAD2C5"/> <!-- Border -->

  <!-- Logo -->
  <rect x="30" y="40" width="40" height="40" rx="10" fill="#CAD2C5"/>
  <path d="M42 52C42 50.8954 42.8954 50 44 50H56C57.1046 50 58 50.8954 58 52V68C58 69.1046 57.1046 70 56 70H44C42.8954 70 42 69.1046 42 68V52Z" stroke="#52796F" stroke-width="2"/>
  <text x="85" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">SageClinic</text>

  <!-- Sidebar Items -->
  <text x="70" y="162" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Dashboard</text>
  <text x="70" y="222" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Appt. Timeline</text>
  <text x="70" y="282" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Doctor Availability</text>

  <!-- Active State: Patients List -->
  <rect x="20" y="330" width="220" height="50" rx="12" fill="#52796F"/>
  <text x="70" y="362" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">Patients List</text>
  <circle cx="45" cy="355" r="3" fill="white"/>

  <!-- Other Items -->
  <text x="70" y="422" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Cancellations</text>
  <text x="70" y="482" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Daily Reports</text>

  <!-- TOP BAR -->
  <text x="290" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3E46">Patients Management</text>
  
  <circle cx="1130" cy="55" r="20" fill="#CAD2C5"/>
  <text x="1100" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46" text-anchor="end">Sarah (Sec)</text>

  <!-- ACTION BAR -->
  <rect x="290" y="90" width="880" height="60" rx="15" fill="white" filter="url(#shadow)"/>
  
  <!-- Search Input -->
  <rect x="310" y="105" width="400" height="30" rx="8" fill="#F0F4F2"/>
  <text x="325" y="125" font-family="Arial, sans-serif" font-size="13" fill="#84A98C">🔍 Search by name, national code, or phone...</text>

  <!-- Filter Button -->
  <rect x="730" y="105" width="90" height="30" rx="8" fill="#F0F4F2" stroke="#CAD2C5" stroke-width="1"/>
  <text x="775" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#52796F" text-anchor="middle">Filters ▼</text>

  <!-- Add Patient Button -->
  <rect x="1010" y="102" width="140" height="36" rx="10" fill="#52796F"/>
  <text x="1080" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">+ New Patient</text>

  <!-- MAIN CONTENT AREA (TABLE) -->
  <rect x="290" y="180" width="880" height="550" rx="25" fill="white" filter="url(#shadow)"/>
  
  <!-- Table Title & count -->
  <text x="320" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F3E46">Registered Patients</text>
  <rect x="500" y="204" width="40" height="20" rx="10" fill="#E8F4F1"/>
  <text x="520" y="218" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#52796F" text-anchor="middle">1,402</text>

  <!-- Table Header -->
  <rect x="290" y="240" width="880" height="40" fill="#FAFCFB"/>
  <rect x="290" y="240" width="880" height="1" fill="#E2E8E4"/>
  <rect x="290" y="280" width="880" height="1" fill="#E2E8E4"/>

  <text x="320" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Patient Name</text>
  <text x="500" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">National Code</text>
  <text x="650" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Phone Number</text>
  <text x="800" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Gender / DOB</text>
  <text x="1000" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Actions</text>

  <!-- ROW 1 -->
  <rect x="290" y="340" width="880" height="1" fill="#F0F4F2"/>
  <circle cx="335" cy="310" r="16" fill="#52796F" fill-opacity="0.1"/>
  <text x="335" y="315" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#52796F" text-anchor="middle">JD</text>
  <text x="365" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">John Doe</text>
  <text x="500" y="315" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">1234567890</text>
  <text x="650" y="315" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">09123456789</text>
  <text x="800" y="308" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Male</text>
  <text x="800" y="325" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">1985-06-15 (39y)</text>
  
  <rect x="1000" y="295" width="60" height="30" rx="6" fill="#E8F4F1"/>
  <text x="1030" y="315" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#52796F" text-anchor="middle">View</text>
  <rect x="1070" y="295" width="30" height="30" rx="6" fill="#F0F4F2"/>
  <text x="1085" y="315" font-family="Arial, sans-serif" font-size="12" fill="#2F3E46" text-anchor="middle">✏️</text>

  <!-- ROW 2 -->
  <rect x="290" y="400" width="880" height="1" fill="#F0F4F2"/>
  <circle cx="335" cy="370" r="16" fill="#F5A623" fill-opacity="0.1"/>
  <text x="335" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F5A623" text-anchor="middle">SJ</text>
  <text x="365" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Sarah Jenkins</text>
  <text x="500" y="375" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">0987654321</text>
  <text x="650" y="375" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">09198765432</text>
  <text x="800" y="368" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Female</text>
  <text x="800" y="385" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">1990-11-22 (34y)</text>

  <rect x="1000" y="355" width="60" height="30" rx="6" fill="#E8F4F1"/>
  <text x="1030" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#52796F" text-anchor="middle">View</text>
  <rect x="1070" y="355" width="30" height="30" rx="6" fill="#F0F4F2"/>
  <text x="1085" y="375" font-family="Arial, sans-serif" font-size="12" fill="#2F3E46" text-anchor="middle">✏️</text>

  <!-- ROW 3 -->
  <rect x="290" y="460" width="880" height="1" fill="#F0F4F2"/>
  <circle cx="335" cy="430" r="16" fill="#52796F" fill-opacity="0.1"/>
  <text x="335" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#52796F" text-anchor="middle">MS</text>
  <text x="365" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Michael Scott</text>
  <text x="500" y="435" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">1122334455</text>
  <text x="650" y="435" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">09112223344</text>
  <text x="800" y="428" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Male</text>
  <text x="800" y="445" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">1978-03-01 (46y)</text>

  <rect x="1000" y="415" width="60" height="30" rx="6" fill="#E8F4F1"/>
  <text x="1030" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#52796F" text-anchor="middle">View</text>
  <rect x="1070" y="415" width="30" height="30" rx="6" fill="#F0F4F2"/>
  <text x="1085" y="435" font-family="Arial, sans-serif" font-size="12" fill="#2F3E46" text-anchor="middle">✏️</text>

  <!-- ROW 4 -->
  <rect x="290" y="520" width="880" height="1" fill="#F0F4F2"/>
  <circle cx="335" cy="490" r="16" fill="#F5A623" fill-opacity="0.1"/>
  <text x="335" y="495" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F5A623" text-anchor="middle">EB</text>
  <text x="365" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Emily Blunt</text>
  <text x="500" y="495" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">5544332211</text>
  <text x="650" y="495" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">09155556666</text>
  <text x="800" y="488" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Female</text>
  <text x="800" y="505" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">1982-08-10 (42y)</text>

  <rect x="1000" y="475" width="60" height="30" rx="6" fill="#E8F4F1"/>
  <text x="1030" y="495" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#52796F" text-anchor="middle">View</text>
  <rect x="1070" y="475" width="30" height="30" rx="6" fill="#F0F4F2"/>
  <text x="1085" y="495" font-family="Arial, sans-serif" font-size="12" fill="#2F3E46" text-anchor="middle">✏️</text>

