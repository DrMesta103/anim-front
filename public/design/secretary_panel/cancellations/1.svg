<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F0F4F2"/>

  <!-- SIDEBAR -->
  <rect width="260" height="800" fill="white"/>
  <rect x="259" y="0" width="1" height="800" fill="#CAD2C5"/> <!-- Border -->

  <!-- Logo -->
  <rect x="30" y="40" width="40" height="40" rx="10" fill="#CAD2C5"/>
  <path d="M42 52C42 50.8954 42.8954 50 44 50H56C57.1046 50 58 50.8954 58 52V68C58 69.1046 57.1046 70 56 70H44C42.8954 70 42 69.1046 42 68V52Z" stroke="#52796F" stroke-width="2"/>
  <text x="85" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">SageClinic</text>

  <!-- Sidebar Items -->
  <text x="70" y="162" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Dashboard</text>
  <text x="70" y="222" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Appt. Timeline</text>
  <text x="70" y="282" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Doctor Availability</text>
  <text x="70" y="342" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Patients List</text>

  <!-- Active State: Cancellations -->
  <rect x="20" y="390" width="220" height="50" rx="12" fill="#52796F"/>
  <text x="70" y="422" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">Cancellations</text>
  <circle cx="45" cy="415" r="3" fill="white"/>

  <!-- Other Items -->
  <text x="70" y="482" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Daily Reports</text>

  <!-- TOP BAR -->
  <text x="290" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3E46">Cancellations Management</text>
  
  <circle cx="1130" cy="55" r="20" fill="#CAD2C5"/>
  <text x="1100" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46" text-anchor="end">Sarah (Sec)</text>

  <!-- ACTION BAR -->
  <rect x="290" y="90" width="880" height="60" rx="15" fill="white" filter="url(#shadow)"/>
  
  <!-- Search Input -->
  <rect x="310" y="105" width="350" height="30" rx="8" fill="#F0F4F2"/>
  <text x="325" y="125" font-family="Arial, sans-serif" font-size="13" fill="#84A98C">🔍 Search patient or doctor...</text>

  <!-- Filter Button -->
  <rect x="680" y="105" width="130" height="30" rx="8" fill="#F0F4F2" stroke="#CAD2C5" stroke-width="1"/>
  <text x="745" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#52796F" text-anchor="middle">Filter by Date ▼</text>

  <!-- Export Button -->
  <rect x="1030" y="102" width="120" height="36" rx="10" fill="#2F3E46"/>
  <text x="1090" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">📥 Export List</text>

  <!-- MAIN CONTENT AREA (TABLE) -->
  <rect x="290" y="180" width="880" height="550" rx="25" fill="white" filter="url(#shadow)"/>
  
  <!-- Table Title & count -->
  <text x="320" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F3E46">Recent Cancellations</text>
  <rect x="520" y="204" width="90" height="20" rx="10" fill="#FFF0F0"/>
  <text x="565" y="218" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D00000" text-anchor="middle">12 Pending</text>

  <!-- Table Header -->
  <rect x="290" y="240" width="880" height="40" fill="#FAFCFB"/>
  <rect x="290" y="240" width="880" height="1" fill="#E2E8E4"/>
  <rect x="290" y="280" width="880" height="1" fill="#E2E8E4"/>

  <text x="320" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Patient</text>
  <text x="480" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Doctor &amp; Specialty</text>
  <text x="660" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Original Appt.</text>
  <text x="820" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Reason / Status</text>
  <text x="1020" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Follow-up Action</text>

  <!-- ROW 1 -->
  <rect x="290" y="350" width="880" height="1" fill="#F0F4F2"/>
  <text x="320" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Emily Blunt</text>
  <text x="320" y="332" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">09155556666</text>
  
  <text x="480" y="315" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Dr. Alan Grant</text>
  <text x="480" y="332" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Cardiology</text>
  
  <text x="660" y="315" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Today, 14:30</text>
  <text x="660" y="332" font-family="Arial, sans-serif" font-size="12" fill="#D00000">Canceled: 2h ago</text>

  <text x="820" y="315" font-family="Arial, sans-serif" font-size="13" fill="#2F3E46">Patient requested</text>
  <rect x="820" y="322" width="100" height="20" rx="10" fill="#FFF0F0"/>
  <text x="870" y="336" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D00000" text-anchor="middle">Pending Contact</text>

  <rect x="1020" y="305" width="85" height="30" rx="6" fill="#52796F"/>
  <text x="1062" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Reschedule</text>

  <!-- ROW 2 -->
  <rect x="290" y="420" width="880" height="1" fill="#F0F4F2"/>
  <text x="320" y="385" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Michael Scott</text>
  <text x="320" y="402" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">09112223344</text>
  
  <text x="480" y="385" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Dr. Sarah Connor</text>
  <text x="480" y="402" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Neurology</text>
  
  <text x="660" y="385" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Tomorrow, 09:00</text>
  <text x="660" y="402" font-family="Arial, sans-serif" font-size="12" fill="#D00000">Canceled: Yesterday</text>

  <text x="820" y="385" font-family="Arial, sans-serif" font-size="13" fill="#2F3E46">Doctor unavailable</text>
  <rect x="820" y="392" width="100" height="20" rx="10" fill="#E8F4F1"/>
  <text x="870" y="406" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#52796F" text-anchor="middle">Resolved</text>

  <rect x="1020" y="375" width="85" height="30" rx="6" fill="#F0F4F2"/>
  <text x="1062" y="395" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C" text-anchor="middle">View Details</text>

  <!-- ROW 3 -->
  <rect x="290" y="490" width="880" height="1" fill="#F0F4F2"/>
  <text x="320" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">John Doe</text>
  <text x="320" y="472" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">09123456789</text>
  
  <text x="480" y="455" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Dr. Henry Wu</text>
  <text x="480" y="472" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Orthopedics</text>
  
  <text x="660" y="455" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">2026-04-02, 11:15</text>
  <text x="660" y="472" font-family="Arial, sans-serif" font-size="12" fill="#D00000">Canceled: Today</text>

  <text x="820" y="455" font-family="Arial, sans-serif" font-size="13" fill="#2F3E46">No Show</text>
  <rect x="820" y="462" width="100" height="20" rx="10" fill="#FFF0F0"/>
  <text x="870" y="476" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D00000" text-anchor="middle">Pending Contact</text>

  <rect x="1020" y="445" width="85" height="30" rx="6" fill="#52796F"/>
  <text x="1062" y="465" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Call Patient</text>

  <!-- ROW 4 -->
  <rect x="290" y="560" width="880" height="1" fill="#F0F4F2"/>
  <text x="320" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">David Miller</text>
  <text x="320" y="542" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">09199998888</text>
  
  <text x="480" y="525" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Dr. Ellie Sattler</text>
  <text x="480" y="542" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Dermatology</text>
  
  <text x="660" y="525" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">2026-04-05, 16:00</text>
  <text x="660" y="542" font-family="Arial, sans-serif" font-size="12" fill="#D00000">Canceled: Today</text>

  <text x="820" y="525" font-family="Arial, sans-serif" font-size="13" fill="#2F3E46">Scheduling Conflict</text>
  <rect x="820" y="532" width="100" height="20" rx="10" fill="#FFF9E6"/>
  <text x="870" y="546" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#F5A623" text-anchor="middle">Awaiting Reply</text>

  <rect x="1020" y="515" width="85" height="30" rx="6" fill="#E8F4F1"/>
  <text x="1062" y="535" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#52796F" text-anchor="middle">Follow Up</text>

  <!-- PAGINATION -->
  <text x="320" y="650" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Showing 1 to 4 of 38 entries</text>
  
  <rect x="940" y="630" width="30" height="30" rx="4" fill="#F0F4F2"/>
  <text x="955" y="650" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#84A98C" text-anchor="middle">&lt;</text>
  
  <rect x="975" y="630" width="30" height="30" rx="4" fill="#52796F"/>
  <text x="990" y="650" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">1</text>
  
  <rect x="1010" y="630" width="30" height="30" rx="4" fill="white" stroke="#E2E8E4"/>
  <text x="1025" y="650" font-family="Arial, sans-serif" font-size="13" fill="#2F3E46" text-anchor="middle">2</text>
  
  <rect x="1045" y="630" width="30" height="30" rx="4" fill="white" stroke="#E2E8E4"/>
  <text x="1060" y="650" font-family="Arial, sans-serif" font-size="13" fill="#2F3E46" text-anchor="middle">3</text>
  
  <text x="1090" y="650" font-family="Arial, sans-serif" font-size="13" fill="#84A98C" text-anchor="middle">...</text>

  <rect x="1110" y="630" width="30" height="30" rx="4" fill="#F0F4F2"/>
  <text x="1125" y="650" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46" text-anchor="middle">&gt;</text>

  <!-- Shadow Filter Definition -->
  <defs>
    <filter id="shadow" x="0" y="0" width="1200" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2F3E46" flood-opacity="0.04"/>
    </filter>
  </defs>
</svg>
