<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Defs for Shadows and Gradients -->
  <defs>
    <filter id="modal-shadow" x="250" y="0" width="700" height="840" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#2F3E46" flood-opacity="0.25"/>
    </filter>
    <filter id="btn-shadow" x="0" y="0" width="160" height="60" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2F3E46" flood-opacity="0.1"/>
    </filter>
    <filter id="blur-bg" x="0" y="0" width="1200" height="800">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- BACKGROUND CONTEXT (Blurred Dashboard)     -->
  <!-- ========================================== -->
  <g filter="url(#blur-bg)">
    <!-- Base Background -->
    <rect width="1200" height="800" fill="#F0F4F2"/>

    <!-- Sidebar -->
    <rect width="260" height="800" fill="white"/>
    <rect x="259" y="0" width="1" height="800" fill="#CAD2C5"/>
    
    <!-- Logo Dummy -->
    <rect x="30" y="40" width="40" height="40" rx="10" fill="#CAD2C5"/>
    <rect x="85" y="50" width="120" height="20" rx="4" fill="#CAD2C5"/>

    <!-- Sidebar Items Dummy -->
    <rect x="30" y="150" width="160" height="15" rx="4" fill="#E2E8E4"/>
    <rect x="30" y="210" width="180" height="15" rx="4" fill="#E2E8E4"/>
    <rect x="20" y="250" width="220" height="50" rx="12" fill="#52796F"/>
    <rect x="30" y="350" width="140" height="15" rx="4" fill="#E2E8E4"/>
    <rect x="30" y="410" width="150" height="15" rx="4" fill="#E2E8E4"/>

    <!-- Main Content Area Dummy -->
    <rect x="290" y="95" width="880" height="680" rx="20" fill="white"/>
    <circle cx="340" cy="145" r="24" fill="#E8F4F1"/>
    <rect x="380" y="130" width="150" height="20" rx="4" fill="#CAD2C5"/>
    <rect x="380" y="160" width="200" height="15" rx="4" fill="#E2E8E4"/>
    
    <rect x="290" y="190" width="880" height="1" fill="#E2E8E4"/>
    <rect x="370" y="322" width="106" height="176" rx="6" fill="#E8F4F1"/>
    <rect x="482" y="367" width="106" height="243" rx="6" fill="#FDF3E1"/>
    <rect x="592" y="412" width="106" height="221" rx="6" fill="#FAFCFB"/>
  </g>

  <!-- ========================================== -->
  <!-- DARK OVERLAY                               -->
  <!-- ========================================== -->
  <rect width="1200" height="800" fill="#2F3E46" fill-opacity="0.4"/>

  <!-- ========================================== -->
  <!-- MODAL CONTAINER                            -->
  <!-- ========================================== -->
  <rect x="350" y="80" width="500" height="640" rx="20" fill="white" filter="url(#modal-shadow)"/>

  <!-- Modal Header -->
  <text x="380" y="125" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">Add Schedule Block</text>
  
  <!-- Close Button -->
  <g style="cursor: pointer;">
    <circle cx="810" cy="118" r="16" fill="#F0F4F2"/>
    <text x="810" y="124" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#84A98C" text-anchor="middle">×</text>
  </g>

  <!-- Header Divider -->
  <rect x="350" y="150" width="500" height="1" fill="#E2E8E4"/>

  <!-- ========================================== -->
  <!-- DOCTOR CONTEXT (Read-only)                 -->
  <!-- ========================================== -->
  <rect x="380" y="170" width="440" height="60" rx="12" fill="#FAFCFB" stroke="#E2E8E4" stroke-width="1"/>
  
  <!-- Avatar -->
  <circle cx="410" cy="200" r="18" fill="#E8F4F1"/>
  <text x="410" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#52796F" text-anchor="middle">AV</text>
  
  <!-- Info -->
  <text x="440" y="196" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Dr. Alice Vance</text>
  <text x="440" y="214" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Cardiology  •  ID: #4092</text>
  
  <rect x="735" y="188" width="65" height="24" rx="12" fill="#E8F4F1"/>
  <text x="767" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#52796F" text-anchor="middle">Change</text>

  <!-- ========================================== -->
  <!-- FORM FIELDS                                -->
  <!-- ========================================== -->

  <!-- 1. Activity Type -->
  <text x="380" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2F3E46">Activity Type <tspan fill="#E68A00">*</tspan></text>
  <rect x="380" y="275" width="440" height="45" rx="8" fill="white" stroke="#52796F" stroke-width="2"/>
  <!-- Focus State Indicator (subtle glow) -->
  <rect x="378" y="273" width="444" height="49" rx="10" fill="none" stroke="#52796F" stroke-width="1" stroke-opacity="0.2"/>
  <text x="395" y="303" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">Clinic Consultation</text>
  <text x="795" y="303" font-family="Arial, sans-serif" font-size="12" fill="#2F3E46" text-anchor="end">▼</text>

  <!-- 2. Date & Location (Row 2) -->
  <!-- Date -->
  <text x="380" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2F3E46">Date <tspan fill="#E68A00">*</tspan></text>
  <rect x="380" y="365" width="210" height="45" rx="8" fill="#FAFCFB" stroke="#E2E8E4" stroke-width="1"/>
  <text x="395" y="393" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Apr 08, 2026</text>
  <!-- Calendar Icon -->
  <rect x="560" y="377" width="16" height="16" rx="2" fill="none" stroke="#84A98C" stroke-width="1.5"/>
  <line x1="560" y1="382" x2="576" y2="382" stroke="#84A98C" stroke-width="1.5"/>
  <line x1="564" y1="375" x2="564" y2="379" stroke="#84A98C" stroke-width="1.5"/>
  <line x1="572" y1="375" x2="572" y2="379" stroke="#84A98C" stroke-width="1.5"/>

  <!-- Location -->
  <text x="610" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2F3E46">Location</text>
  <rect x="610" y="365" width="210" height="45" rx="8" fill="#FAFCFB" stroke="#E2E8E4" stroke-width="1"/>
  <text x="625" y="393" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Room 102</text>
  <text x="800" y="393" font-family="Arial, sans-serif" font-size="12" fill="#84A98C" text-anchor="end">▼</text>

  <!-- 3. Start & End Time (Row 3) -->
  <!-- Start Time -->
  <text x="380" y="445" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2F3E46">Start Time <tspan fill="#E68A00">*</tspan></text>
  <rect x="380" y="455" width="210" height="45" rx="8" fill="#FAFCFB" stroke="#E2E8E4" stroke-width="1"/>
  <text x="395" y="483" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">08:00</text>
  <text x="570" y="483" font-family="Arial, sans-serif" font-size="12" fill="#84A98C" text-anchor="end">🕒</text>

  <!-- End Time -->
  <text x="610" y="445" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2F3E46">End Time <tspan fill="#E68A00">*</tspan></text>
  <rect x="610" y="455" width="210" height="45" rx="8" fill="#FAFCFB" stroke="#E2E8E4" stroke-width="1"/>
  <text x="625" y="483" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">12:00</text>
  <text x="800" y="483" font-family="Arial, sans-serif" font-size="12" fill="#84A98C" text-anchor="end">🕒</text>

  <!-- 4. Notes (Row 4) -->
  <text x="380" y="535" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2F3E46">Notes (Optional)</text>
  <rect x="380" y="545" width="440" height="70" rx="8" fill="#FAFCFB" stroke="#E2E8E4" stroke-width="1"/>
  <text x="395" y="565" font-family="Arial, sans-serif" font-size="13" fill="#84A98C">E.g., Special equipment needed, max patient count...</text>
  
  <!-- Resize Handle indicator -->
  <path d="M805 600 L815 610 M810 600 L815 605" stroke="#CAD2C5" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ========================================== -->
  <!-- MODAL FOOTER                               -->
  <!-- ========================================== -->
  <rect x="350" y="635" width="500" height="1" fill="#E2E8E4"/>

  <!-- Cancel Button -->
  <g style="cursor: pointer;">
    <rect x="540" y="655" width="130" height="45" rx="10" fill="white" stroke="#CAD2C5" stroke-width="1"/>
    <text x="605" y="682" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46" text-anchor="middle">Cancel</text>
  </g>

  <!-- Save Button -->
  <g style="cursor: pointer;">
    <rect x="690" y="655" width="130" height="45" rx="10" fill="#52796F" filter="url(#btn-shadow)"/>
    <text x="755" y="682" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Save Block</text>
  </g>

</svg>
