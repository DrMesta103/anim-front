<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2F3E46" flood-opacity="0.08" />
    </filter>
    <filter id="card-hover-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2F3E46" flood-opacity="0.15" />
    </filter>
    <filter id="header-shadow" x="0" y="0" width="100%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2F3E46" flood-opacity="0.1" />
    </filter>
    
    <!-- Avatars Clip Path -->
    <clipPath id="avatar-clip">
      <circle cx="0" cy="0" r="28" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#F0F4F2" />

  <!-- Top Navigation Bar -->
  <rect width="1200" height="70" fill="#2F3E46" filter="url(#header-shadow)" />
  
  <!-- Logo Area -->
  <rect x="30" y="20" width="30" height="30" rx="6" fill="#84A98C" />
  <path d="M45 28v14M38 35h14" stroke="#2F3E46" stroke-width="3" stroke-linecap="round" />
  <text x="75" y="42" fill="#FFFFFF" font-size="20" font-weight="bold" letter-spacing="0.5">MedStaff</text>

  <!-- Navigation Links -->
  <text x="240" y="41" fill="#FFFFFF" font-size="15" font-weight="600">Doctors</text>
  <rect x="230" y="66" width="75" height="4" rx="2" fill="#84A98C" /> <!-- Active Indicator -->
  
  <text x="340" y="41" fill="#CAD2C5" font-size="15" font-weight="500">Shifts &amp; Scheduling</text>
  <text x="510" y="41" fill="#CAD2C5" font-size="15" font-weight="500">Reports</text>

  <!-- User Profile & Actions -->
  <rect x="940" y="15" width="220" height="40" rx="20" fill="#52796F" fill-opacity="0.3" />
  <circle cx="960" cy="35" r="14" fill="#84A98C" />
  <text x="985" y="40" fill="#FFFFFF" font-size="14" font-weight="500">Admin User</text>
  <!-- Chevron Down -->
  <path d="M1130 32 L1135 37 L1140 32" fill="none" stroke="#CAD2C5" stroke-width="2" stroke-linecap="round" />

  <!-- Main Content Area -->
  <g transform="translate(50, 110)">
    
    <!-- Page Header & Controls -->
    <text x="0" y="30" fill="#2F3E46" font-size="28" font-weight="700">Doctor Directory</text>
    
    <!-- Search Bar -->
    <rect x="0" y="55" width="400" height="44" rx="8" fill="#FFFFFF" stroke="#CAD2C5" stroke-width="1" />
    <path d="M20 77 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M32 89 L38 95" fill="none" stroke="#84A98C" stroke-width="2" stroke-linecap="round" />
    <text x="45" y="82" fill="#84A98C" font-size="15">Search by name, ID, or specialty...</text>

    <!-- Filters -->
    <rect x="420" y="55" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#CAD2C5" stroke-width="1" />
    <text x="440" y="82" fill="#2F3E46" font-size="15">All Specialties</text>
    <path d="M550 74 L555 79 L560 74" fill="none" stroke="#52796F" stroke-width="2" stroke-linecap="round" />

    <rect x="595" y="55" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#CAD2C5" stroke-width="1" />
    <text x="615" y="82" fill="#2F3E46" font-size="15">Status: All</text>
    <path d="M700 74 L705 79 L710 74" fill="none" stroke="#52796F" stroke-width="2" stroke-linecap="round" />

    <!-- Add Doctor Button -->
    <rect x="940" y="55" width="160" height="44" rx="8" fill="#52796F" />
    <path d="M975 70v14M968 77h14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="995" y="82" fill="#FFFFFF" font-size="15" font-weight="600">Add Doctor</text>

    <!-- ========================================== -->
    <!-- SPECIALTY SECTION 1: CARDIOLOGY            -->
    <!-- ========================================== -->
    <g transform="translate(0, 140)">
      <!-- Section Header -->
      <rect x="0" y="0" width="40" height="40" rx="8" fill="#52796F" fill-opacity="0.15" />
      <path d="M12 24 L16 16 L22 28 L28 14 L30 20" fill="none" stroke="#52796F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="55" y="26" fill="#2F3E46" font-size="20" font-weight="700">Cardiology</text>
      <rect x="55" y="40" width="1045" height="1" fill="#CAD2C5" />

      <!-- Card 1: Dr. Robert Chen (HOVER STATE - Indicating Clickability) -->
      <g transform="translate(0, 60)" style="cursor: pointer;">
        <rect width="335" height="130" rx="12" fill="#FFFFFF" stroke="#52796F" stroke-width="2" filter="url(#card-hover-shadow)" />
        <g transform="translate(30, 40)">
          <circle cx="0" cy="0" r="28" fill="#84A98C" />
          <text x="0" y="5" fill="#FFFFFF" font-size="18" font-weight="bold" text-anchor="middle">RC</text>
        </g>
        <!-- Active Status Dot -->
        <circle cx="50" cy="58" r="6" fill="#52796F" stroke="#FFFFFF" stroke-width="2" />
        
        <text x="75" y="30" fill="#2F3E46" font-size="16" font-weight="700">Dr. Robert Chen</text>
        <text x="75" y="50" fill="#52796F" font-size="13" font-weight="500">Chief Cardiologist</text>
        
        <!-- Stats -->
        <rect x="75" y="65" width="70" height="22" rx="4" fill="#F0F4F2" />
        <text x="83" y="80" fill="#2F3E46" font-size="11" font-weight="600">32 Shifts</text>

        <rect x="150" y="65" width="85" height="22" rx="4" fill="#F0F4F2" />
        <text x="158" y="80" fill="#2F3E46" font-size="11" font-weight="600">98% Booked</text>

        <!-- View Schedule Action Button (Visible on Hover) -->
        <rect x="25" y="100" width="285" height="0" rx="0" fill="#52796F" /> <!-- Just a conceptual separator -->
        <line x1="25" y1="95" x2="310" y2="95" stroke="#F0F4F2" stroke-width="1" />
        <text x="167" y="117" fill="#52796F" font-size="13" font-weight="600" text-anchor="middle">View Schedule &amp; Shifts</text>
        <path d="M235 113 L240 118 L235 123" fill="none" stroke="#52796F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Card 2: Dr. Sarah Jenkins -->
      <g transform="translate(355, 60)" style="cursor: pointer;">
        <rect width="335" height="130" rx="12" fill="#FFFFFF" stroke="#CAD2C5" stroke-width="1" filter="url(#card-shadow)" />
        <g transform="translate(30, 40)">
          <circle cx="0" cy="0" r="28" fill="#CAD2C5" />
          <text x="0" y="5" fill="#2F3E46" font-size="18" font-weight="bold" text-anchor="middle">SJ</text>
        </g>
        <circle cx="50" cy="58" r="6" fill="#52796F" stroke="#FFFFFF" stroke-width="2" />
        
        <text x="75" y="30" fill="#2F3E46" font-size="16" font-weight="700">Dr. Sarah Jenkins</text>
        <text x="75" y="50" fill="#84A98C" font-size="13" font-weight="500">Interventional Cardiology</text>
        
        <rect x="75" y="65" width="70" height="22" rx="4" fill="#F0F4F2" />
        <text x="83" y="80" fill="#2F3E46" font-size="11" font-weight="600">28 Shifts</text>

        <rect x="150" y="65" width="85" height="22" rx="4" fill="#F0F4F2" />
        <text x="158" y="80" fill="#2F3E46" font-size="11" font-weight="600">85% Booked</text>

        <line x1="25" y1="95" x2="310" y2="95" stroke="#F0F4F2" stroke-width="1" />
        <text x="167" y="117" fill="#84A98C" font-size="13" font-weight="600" text-anchor="middle">View Schedule</text>
      </g>

      <!-- Card 3: Dr. Michael Torres -->
      <g transform="translate(710, 60)" style="cursor: pointer;">
        <rect width="335" height="130" rx="12" fill="#FFFFFF" stroke="#CAD2C5" stroke-width="1" filter="url(#card-shadow)" />
        <g transform="translate(30, 40)">
          <circle cx="0" cy="0" r="28" fill="#CAD2C5" />
          <text x="0" y="5" fill="#2F3E46" font-size="18" font-weight="bold" text-anchor="middle">MT</text>
        </g>
        <!-- Inactive/On Leave Status -->
        <circle cx="50" cy="58" r="6" fill="#FFB703" stroke="#FFFFFF" stroke-width="2" />
        
        <text x="75" y="30" fill="#2F3E46" font-size="16" font-weight="700">Dr. Michael Torres</text>
        <text x="75" y="50" fill="#84A98C" font-size="13" font-weight="500">Pediatric Cardiology</text>
        
        <rect x="75" y="65" width="70" height="22" rx="4" fill="#F0F4F2" />
        <text x="83" y="80" fill="#2F3E46" font-size="11" font-weight="600">12 Shifts</text>

        <rect x="150" y="65" width="60" height="22" rx="4" fill="#FFF3CD" />
        <text x="158" y="80" fill="#856404" font-size="11" font-weight="600">On Leave</text>

        <line x1="25" y1="95" x2="310" y2="95" stroke="#F0F4F2" stroke-width="1" />
        <text x="167" y="117" fill="#84A98C" font-size="13" font-weight="600" text-anchor="middle">View Schedule</text>
      </g>
    </g>


    <!-- ========================================== -->
    <!-- SPECIALTY SECTION 2: NEUROLOGY             -->
    <!-- ========================================== -->
    <g transform="translate(0, 370)">
      <!-- Section Header -->
      <rect x="0" y="0" width="40" height="40" rx="8" fill="#52796F" fill-opacity="0.15" />
      <path d="M20 12 C12 12, 12 28, 20 28 C28 28, 28 12, 20 12 Z M20 16 C22 16, 24 18, 24 20" fill="none" stroke="#52796F" stroke-width="2" stroke-linecap="round" />
      <text x="55" y="26" fill="#2F3E46" font-size="20" font-weight="700">Neurology</text>
      <rect x="55" y="40" width="1045" height="1" fill="#CAD2C5" />

      <!-- Card 4: Dr. Emily Stanton -->
      <g transform="translate(0, 60)" style="cursor: pointer;">
        <rect width="335" height="130" rx="12" fill="#FFFFFF" stroke="#CAD2C5" stroke-width="1" filter="url(#card-shadow)" />
        <g transform="translate(30, 40)">
          <circle cx="0" cy="0" r="28" fill="#CAD2C5" />
          <text x="0" y="5" fill="#2F3E46" font-size="18" font-weight="bold" text-anchor="middle">ES</text>
        </g>
        <circle cx="50" cy="58" r="6" fill="#52796F" stroke="#FFFFFF" stroke-width="2" />
        
        <text x="75" y="30" fill="#2F3E46" font-size="16" font-weight="700">Dr. Emily Stanton</text>
        <text x="75" y="50" fill="#84A98C" font-size="13" font-weight="500">Senior Neurologist</text>
        
        <rect x="75" y="65" width="70" height="22" rx="4" fill="#F0F4F2" />
        <text x="83" y="80" fill="#2F3E46" font-size="11" font-weight="600">40 Shifts</text>

        <rect x="150" y="65" width="85" height="22" rx="4" fill="#F0F4F2" />
        <text x="158" y="80" fill="#2F3E46" font-size="11" font-weight="600">100% Booked</text>

        <line x1="25" y1="95" x2="310" y2="95" stroke="#F0F4F2" stroke-width="1" />
        <text x="167" y="117" fill="#84A98C" font-size="13" font-weight="600" text-anchor="middle">View Schedule</text>
      </g>

      <!-- Card 5: Dr. David K. Osei -->
      <g transform="translate(355, 60)" style="cursor: pointer;">
        <rect width="335" height="130" rx="12" fill="#FFFFFF" stroke="#CAD2C5" stroke-width="1" filter="url(#card-shadow)" />
        <g transform="translate(30, 40)">
          <circle cx="0" cy="0" r="28" fill="#CAD2C5" />
          <text x="0" y="5" fill="#2F3E46" font-size="18" font-weight="bold" text-anchor="middle">DO</text>
        </g>
        <circle cx="50" cy="58" r="6" fill="#52796F" stroke="#FFFFFF" stroke-width="2" />
        
        <text x="75" y="30" fill="#2F3E46" font-size="16" font-weight="700">Dr. David K. Osei</text>
        <text x="75" y="50" fill="#84A98C" font-size="13" font-weight="500">Neurosurgeon</text>
        
        <rect x="75" y="65" width="70" height="22" rx="4" fill="#F0F4F2" />
        <text x="83" y="80" fill="#2F3E46" font-size="11" font-weight="600">18 Shifts</text>

        <rect x="150" y="65" width="85" height="22" rx="4" fill="#F0F4F2" />
        <text x="158" y="80" fill="#2F3E46" font-size="11" font-weight="600">60% Booked</text>

        <line x1="25" y1="95" x2="310" y2="95" stroke="#F0F4F2" stroke-width="1" />
        <text x="167" y="117" fill="#84A98C" font-size="13" font-weight="600" text-anchor="middle">View Schedule</text>
      </g>
    </g>


    <!-- ========================================== -->
    <!-- SPECIALTY SECTION 3: PEDIATRICS            -->
    <!-- ========================================== -->
    <g transform="translate(0, 600)">
      <!-- Section Header -->
      <rect x="0" y="0" width="40" height="40" rx="8" fill="#52796F" fill-opacity="0.15" />
      <circle cx="20" cy="18" r="5" fill="none" stroke="#52796F" stroke-width="2" />
      <path d="M12 28 C12 23, 28 23, 28 28" fill="none" stroke="#52796F" stroke-width="2" stroke-linecap="round" />
      <text x="55" y="26" fill="#2F3E46" font-size="20" font-weight="700">Pediatrics</text>
      <rect x="55" y="40" width="1045" height="1" fill="#CAD2C5" />

      <!-- Card 6: Dr. Lisa Cuddy -->
      <g transform="translate(0, 60)" style="cursor: pointer;">
        <rect width="335" height="130" rx="12" fill="#FFFFFF" stroke="#CAD2C5" stroke-width="1" filter="url(#card-shadow)" />
        <g transform="translate(30, 40)">
          <circle cx="0" cy="0" r="28" fill="#CAD2C5" />
          <text x="0" y="5" fill="#2F3E46" font-size="18" font-weight="bold" text-anchor="middle">LC</text>
        </g>
        <circle cx="50" cy="58" r="6" fill="#52796F" stroke="#FFFFFF" stroke-width="2" />
        
        <text x="75" y="30" fill="#2F3E46" font-size="16" font-weight="700">Dr. Lisa Cuddy</text>
        <text x="75" y="50" fill="#84A98C" font-size="13" font-weight="500">General Pediatrics</text>
        
        <rect x="75" y="65" width="70" height="22" rx="4" fill="#F0F4F2" />
        <text x="83" y="80" fill="#2F3E46" font-size="11" font-weight="600">22 Shifts</text>

        <rect x="150" y="65" width="85" height="22" rx="4" fill="#F0F4F2" />
        <text x="158" y="80" fill="#2F3E46" font-size="11" font-weight="600">92% Booked</text>

        <line x1="25" y1="95" x2="310" y2="95" stroke="#F0F4F2" stroke-width="1" />
        <text x="167" y="117" fill="#84A98C" font-size="13" font-weight="600" text-anchor="middle">View Schedule</text>
      </g>

      <!-- Card 7: Dr. James Wilson -->
      <g transform="translate(355, 60)" style="cursor: pointer;">
        <rect width="335" height="130" rx="12" fill="#FFFFFF" stroke="#CAD2C5" stroke-width="1" filter="url(#card-shadow)" />
        <g transform="translate(30, 40)">
          <circle cx="0" cy="0" r="28" fill="#CAD2C5" />
          <text x="0" y="5" fill="#2F3E46" font-size="18" font-weight="bold" text-anchor="middle">JW</text>
        </g>
        <circle cx="50" cy="58" r="6" fill="#52796F" stroke="#FFFFFF" stroke-width="2" />
        
        <text x="75" y="30" fill="#2F3E46" font-size="16" font-weight="700">Dr. James Wilson</text>
        <text x="75" y="50" fill="#84A98C" font-size="13" font-weight="500">Pediatric Oncology</text>
        
        <rect x="75" y="65" width="70" height="22" rx="4" fill="#F0F4F2" />
        <text x="83" y="80" fill="#2F3E46" font-size="11" font-weight="600">20 Shifts</text>

        <rect x="150" y="65" width="85" height="22" rx="4" fill="#F0F4F2" />
        <text x="158" y="80" fill="#2F3E46" font-size="11" font-weight="600">75% Booked</text>

        <line x1="25" y1="95" x2="310" y2="95" stroke="#F0F4F2" stroke-width="1" />
        <text x="167" y="117" fill="#84A98C" font-size="13" font-weight="600" text-anchor="middle">View Schedule</text>
      </g>
    </g>

  </g>
</svg>
