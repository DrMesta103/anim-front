<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Defs for Shadows and Gradients -->
  <defs>
    <filter id="shadow" x="0" y="0" width="1200" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2F3E46" flood-opacity="0.04"/>
    </filter>
    <filter id="btn-shadow" x="0" y="0" width="160" height="60" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2F3E46" flood-opacity="0.1"/>
    </filter>
    <pattern id="diagonalHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#E2E8E4" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F0F4F2"/>

  <!-- ========================================== -->
  <!-- SIDEBAR (Matching Theme)                   -->
  <!-- ========================================== -->
  <rect width="260" height="800" fill="white"/>
  <rect x="259" y="0" width="1" height="800" fill="#CAD2C5"/>

  <!-- Logo -->
  <rect x="30" y="40" width="40" height="40" rx="10" fill="#CAD2C5"/>
  <path d="M42 52C42 50.8954 42.8954 50 44 50H56C57.1046 50 58 50.8954 58 52V68C58 69.1046 57.1046 70 56 70H44C42.8954 70 42 69.1046 42 68V52Z" stroke="#52796F" stroke-width="2"/>
  <text x="85" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">SageClinic</text>

  <!-- Sidebar Items -->
  <text x="70" y="162" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Dashboard</text>
  <text x="70" y="222" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Appts. Management</text>

  <!-- Active State: Doctor Availability -->
  <rect x="20" y="260" width="220" height="50" rx="12" fill="#52796F"/>
  <text x="70" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">Doctor Availability</text>
  <circle cx="45" cy="285" r="3" fill="white"/>

  <!-- Other Items -->
  <text x="70" y="362" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Patients List</text>
  <text x="70" y="422" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Cancellations</text>
  <text x="70" y="482" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Daily Reports</text>

  <!-- ========================================== -->
  <!-- TOP BAR                                    -->
  <!-- ========================================== -->
  <!-- Back Button to Directory -->
  <g style="cursor: pointer;">
    <rect x="290" y="40" width="30" height="30" rx="8" fill="#E8F4F1"/>
    <text x="305" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F" text-anchor="middle">←</text>
    <text x="330" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#52796F">Back to Directory</text>
  </g>
  
  <text x="500" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">|</text>
  <text x="520" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">Schedule &amp; Shifts</text>

  <circle cx="1130" cy="55" r="20" fill="#CAD2C5"/>
  <text x="1100" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46" text-anchor="end">Sarah (Sec)</text>

  <!-- ========================================== -->
  <!-- MAIN CONTAINER                             -->
  <!-- ========================================== -->
  <rect x="290" y="95" width="880" height="680" rx="20" fill="white" filter="url(#shadow)"/>

  <!-- Header: Doctor Profile & Actions -->
  <circle cx="340" cy="145" r="24" fill="#E8F4F1"/>
  <text x="340" y="151" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#52796F" text-anchor="middle">AV</text>
  
  <text x="380" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F3E46">Dr. Alice Vance</text>
  <text x="380" y="160" font-family="Arial, sans-serif" font-size="13" fill="#84A98C">Head of Cardiology  •  Staff ID: #4092</text>

  <!-- Quick Stats -->
  <rect x="620" y="125" width="1" height="40" fill="#E2E8E4"/>
  <text x="640" y="140" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Weekly Hours</text>
  <text x="640" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F3E46">36h 00m</text>

  <rect x="740" y="125" width="1" height="40" fill="#E2E8E4"/>
  <text x="760" y="140" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Status</text>
  <circle cx="766" cy="155" r="4" fill="#52796F"/>
  <text x="776" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">On Duty</text>

  <!-- Actions -->
  <rect x="910" y="125" width="110" height="40" rx="10" fill="#FAFCFB" stroke="#E2E8E4" stroke-width="1"/>
  <text x="965" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2F3E46" text-anchor="middle">Add Leave</text>

  <rect x="1030" y="125" width="110" height="40" rx="10" fill="#52796F" filter="url(#btn-shadow)"/>
  <text x="1085" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Edit Shifts</text>

  <rect x="290" y="190" width="880" height="1" fill="#E2E8E4"/>

  <!-- ========================================== -->
  <!-- CALENDAR CONTROLS & VIEW TOGGLE (DAY)      -->
  <!-- ========================================== -->
  <rect x="320" y="215" width="30" height="30" rx="8" fill="#F0F4F2"/>
  <text x="335" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46" text-anchor="middle">&lt;</text>
  
  <!-- Current Day (from previous context) -->
  <text x="440" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2F3E46" text-anchor="middle">Thursday, April 2, 2026</text>
  
  <rect x="530" y="215" width="30" height="30" rx="8" fill="#F0F4F2"/>
  <text x="545" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46" text-anchor="middle">&gt;</text>

  <!-- View Toggle (Day Active) -->
  <rect x="940" y="210" width="200" height="40" rx="10" fill="#F0F4F2"/>
  <rect x="944" y="214" width="64" height="32" rx="8" fill="white" filter="url(#btn-shadow)"/>
  <text x="976" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2F3E46" text-anchor="middle">Day</text>
  <text x="1040" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#84A98C" text-anchor="middle">Week</text>
  <text x="1106" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#84A98C" text-anchor="middle">Month</text>

  <!-- ========================================== -->
  <!-- DAY VIEW GRID (Timeline)                   -->
  <!-- ========================================== -->
  <!-- Time Labels & Horizontal Grid Lines -->
  <!-- 1 Hour = 50px. Starting 08:00 at Y=280 -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#84A98C" text-anchor="end">
    <!-- 08:00 AM -->
    <text x="375" y="284">08:00</text>
    <line x1="390" y1="280" x2="1140" y2="280" stroke="#E2E8E4" stroke-width="1"/>
    <line x1="390" y1="305" x2="1140" y2="305" stroke="#E2E8E4" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- 09:00 AM -->
    <text x="375" y="334">09:00</text>
    <line x1="390" y1="330" x2="1140" y2="330" stroke="#E2E8E4" stroke-width="1"/>
    <line x1="390" y1="355" x2="1140" y2="355" stroke="#E2E8E4" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- 10:00 AM -->
    <text x="375" y="384">10:00</text>
    <line x1="390" y1="380" x2="1140" y2="380" stroke="#E2E8E4" stroke-width="1"/>
    <line x1="390" y1="405" x2="1140" y2="405" stroke="#E2E8E4" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- 11:00 AM -->
    <text x="375" y="434">11:00</text>
    <line x1="390" y1="430" x2="1140" y2="430" stroke="#E2E8E4" stroke-width="1"/>
    <line x1="390" y1="455" x2="1140" y2="455" stroke="#E2E8E4" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- 12:00 PM -->
    <text x="375" y="484">12:00</text>
    <line x1="390" y1="480" x2="1140" y2="480" stroke="#E2E8E4" stroke-width="1"/>
    <line x1="390" y1="505" x2="1140" y2="505" stroke="#E2E8E4" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- 01:00 PM -->
    <text x="375" y="534">13:00</text>
    <line x1="390" y1="530" x2="1140" y2="530" stroke="#E2E8E4" stroke-width="1"/>
    <line x1="390" y1="555" x2="1140" y2="555" stroke="#E2E8E4" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- 02:00 PM -->
    <text x="375" y="584">14:00</text>
    <line x1="390" y1="580" x2="1140" y2="580" stroke="#E2E8E4" stroke-width="1"/>
    <line x1="390" y1="605" x2="1140" y2="605" stroke="#E2E8E4" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- 03:00 PM -->
    <text x="375" y="634">15:00</text>
    <line x1="390" y1="630" x2="1140" y2="630" stroke="#E2E8E4" stroke-width="1"/>
    <line x1="390" y1="655" x2="1140" y2="655" stroke="#E2E8E4" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- 04:00 PM -->
    <text x="375" y="684">16:00</text>
    <line x1="390" y1="680" x2="1140" y2="680" stroke="#E2E8E4" stroke-width="1"/>
    <line x1="390" y1="705" x2="1140" y2="705" stroke="#E2E8E4" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- 05:00 PM -->
    <text x="375" y="734">17:00</text>
    <line x1="390" y1="730" x2="1140" y2="730" stroke="#E2E8E4" stroke-width="1"/>
  </g>

  <!-- ========================================== -->
  <!-- SHIFTS & APPOINTMENTS                      -->
  <!-- ========================================== -->

  <!-- SHIFT 1: Clinic Consultation (08:00 AM - 12:00 PM) -->
  <g>
    <!-- Shift Background (Span 4 hours = 200px) -->
    <rect x="400" y="280" width="730" height="200" rx="6" fill="#E8F4F1" opacity="0.6"/>
    <!-- Left Accent Bar -->
    <rect x="400" y="280" width="6" height="200" rx="3" fill="#52796F"/>
    
    <!-- Shift Info -->
    <text x="418" y="302" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F">Clinic Consultation</text>
    <text x="418" y="320" font-family="Arial, sans-serif" font-size="12" fill="#2F3E46">Room 102 - Cardiology</text>
    <rect x="418" y="332" width="75" height="20" rx="10" fill="white"/>
    <text x="455" y="346" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#84A98C" text-anchor="middle">4 / 6 Booked</text>

    <!-- Individual Appointments Area (X=560 to 1110) -->
    
    <!-- Appt 1: 08:00 - 08:30 (30 mins = 25px) -->
    <g transform="translate(560, 283)">
      <rect x="0" y="0" width="550" height="21" rx="4" fill="white" stroke="#CAD2C5"/>
      <rect x="0" y="0" width="4" height="21" rx="2" fill="#52796F"/>
      <text x="12" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#84A98C">08:00 - 08:30</text>
      <text x="100" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Marcus Johnson</text>
      <text x="210" y="14" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">—  Routine Checkup (Completed)</text>
    </g>

    <!-- Appt 2: 08:30 - 09:15 (45 mins = ~38px) -->
    <g transform="translate(560, 307)">
      <rect x="0" y="0" width="550" height="34" rx="4" fill="white" stroke="#CAD2C5"/>
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#52796F"/>
      <text x="12" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#84A98C">08:30 - 09:15</text>
      <text x="100" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Sarah Jenkins</text>
      <text x="210" y="21" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">—  ECG Follow-up (Completed)</text>
    </g>

    <!-- Appt 3: 09:30 - 10:00 (30 mins = 25px) -->
    <g transform="translate(560, 357)">
      <rect x="0" y="0" width="550" height="21" rx="4" fill="white" stroke="#E2E8E4" filter="url(#btn-shadow)"/>
      <rect x="0" y="0" width="4" height="21" rx="2" fill="#E68A00"/>
      <text x="12" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E68A00">09:30 - 10:00</text>
      <text x="100" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">David Lee</text>
      <text x="210" y="14" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">—  Prescription Renewal (In Progress)</text>
    </g>

    <!-- Appt 4: 10:00 - 10:45 (Cancelled) -->
    <g transform="translate(560, 382)">
      <rect x="0" y="0" width="550" height="34" rx="4" fill="#FAFCFB" stroke="#E2E8E4" stroke-dasharray="4 4"/>
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#D65A5A"/>
      <text x="12" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D65A5A">10:00 - 10:45</text>
      <text x="100" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#84A98C" text-decoration="line-through">Emma Watson</text>
      <text x="210" y="21" font-family="Arial, sans-serif" font-size="11" fill="#D65A5A" font-style="italic">—  Cancelled (Patient Request)</text>
      <!-- Re-open slot button -->
      <rect x="460" y="8" width="75" height="18" rx="4" fill="white" stroke="#CAD2C5"/>
      <text x="497.5" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#52796F" text-anchor="middle">Open Slot</text>
    </g>

    <!-- Appt 5: 11:00 - 11:45 -->
    <g transform="translate(560, 432)">
      <rect x="0" y="0" width="550" height="34" rx="4" fill="white" stroke="#E2E8E4"/>
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#52796F"/>
      <text x="12" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#52796F">11:00 - 11:45</text>
      <text x="100" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Michael Chang</text>
      <text x="210" y="21" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">—  Post-Op Review</text>
    </g>
  </g>

  <!-- LUNCH / ADMIN BREAK (12:00 PM - 02:00 PM) -->
  <g>
    <rect x="400" y="480" width="730" height="100" fill="url(#diagonalHatch)" opacity="0.5"/>
    <rect x="705" y="515" width="120" height="30" rx="15" fill="white" stroke="#E2E8E4"/>
    <text x="765" y="534" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C" text-anchor="middle">Break / Admin</text>
  </g>

  <!-- SHIFT 2: On-Call (02:00 PM - 05:00 PM) -->
  <g>
    <!-- Shift Background (Span 3 hours = 150px) -->
    <rect x="400" y="580" width="730" height="150" rx="6" fill="#FDF3E1" stroke="#E68A00" stroke-dasharray="6 4" opacity="0.6"/>
    <!-- Left Accent Bar -->
    <rect x="400" y="580" width="6" height="150" rx="3" fill="#E68A00"/>
    
    <!-- Shift Info -->
    <text x="418" y="602" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E68A00">On-Call / Ward Emergency</text>
    <text x="418" y="620" font-family="Arial, sans-serif" font-size="12" fill="#2F3E46">Cardiology Ward - Floor 3</text>
    <text x="418" y="650" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" font-style="italic">No scheduled appointments. Doctor available for ward calls and ER consultations.</text>
  </g>

  <!-- ========================================== -->
  <!-- CURRENT TIME INDICATOR (09:45 AM)          -->
  <!-- ========================================== -->
  <!-- 09:00 = 330, 45 mins = (45/60)*50 = 37.5. Y = 367.5 -->
  <g>
    <!-- Line -->
    <line x1="380" y1="367.5" x2="1140" y2="367.5" stroke="#D65A5A" stroke-width="1.5"/>
    <!-- Dot on Grid -->
    <circle cx="390" cy="367.5" r="4" fill="#D65A5A"/>
    <!-- Time Badge -->
    <rect x="325" y="357" width="50" height="21" rx="4" fill="#D65A5A"/>
    <text x="350" y="372" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">09:45</text>
  </g>

  <!-- Gray Overlay for Past Time (08:00 to 09:45) -->
  <rect x="406" y="280" width="724" height="87.5" fill="#FAFCFB" opacity="0.4" style="pointer-events: none;"/>

  <!-- Scrollbar Simulator -->
  <rect x="1155" y="220" width="6" height="540" rx="3" fill="#F0F4F2"/>
  <rect x="1155" y="280" width="6" height="200" rx="3" fill="#CAD2C5"/>

</svg>
