<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color: #f4f7f9; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.05" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <style>
      .btn-hover:hover { opacity: 0.9; cursor: pointer; }
      .back-btn:hover { fill: #EFF6FF; cursor: pointer; }
    </style>
  </defs>

  <!-- SIDEBAR (Minimized or Standard) -->
  <rect x="0" y="0" width="250" height="800" fill="#ffffff" filter="url(#shadow)" />
  <text x="30" y="45" font-size="22" font-weight="bold" fill="#1E293B">MedAdmin</text>
  <text x="30" y="65" font-size="12" font-weight="500" fill="#64748B">Secretary Panel</text>
  <g transform="translate(15, 100)">
    <rect x="0" y="52" width="220" height="44" rx="8" fill="#EFF6FF" />
    <text x="45" y="79" font-size="14" fill="#2563EB" font-weight="600">Doctor Schedules</text>
    <rect x="5" y="60" width="4" height="28" rx="2" fill="#2563EB" />
  </g>

  <!-- MAIN CONTENT HEADER -->
  <rect x="250" y="0" width="950" height="80" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Breadcrumb / Back Navigation -->
  <g class="back-btn" transform="translate(280, 25)">
    <rect x="-10" y="-5" width="200" height="34" rx="6" fill="transparent" />
    <path d="M5 12 l-5 -5 l5 -5" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 5)"/>
    <text x="15" y="17" font-size="14" font-weight="500" fill="#64748B">All Doctors</text>
  </g>
  <text x="375" y="42" font-size="14" font-weight="500" fill="#94A3B8">/</text>
  <text x="390" y="42" font-size="16" font-weight="bold" fill="#0F172A">Dr. Sarah Jenkins (Cardiology)</text>

  <!-- Add New Schedule Button -->
  <g transform="translate(970, 20)" class="btn-hover">
    <rect x="0" y="0" width="150" height="40" rx="8" fill="url(#primary-grad)" />
    <text x="40" y="25" font-size="14" font-weight="600" fill="#ffffff">+ New Schedule</text>
  </g>

  <!-- WEEKLY CALENDAR CONTAINER -->
  <g transform="translate(290, 100)">
    <rect x="0" y="0" width="870" height="660" rx="12" fill="#ffffff" stroke="#E2E8F0" filter="url(#shadow)"/>
    
    <!-- Calendar Header (Days) -->
    <rect x="0" y="0" width="870" height="50" fill="#F8FAFC" rx="12" />
    <line x1="0" y1="50" x2="870" y2="50" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Dates & Days -->
    <!-- Column Width: 115px (870 - 65 for time col = 805 / 7 = 115px) -->
    <g font-size="13" font-weight="600" fill="#475569" text-anchor="middle">
      <text x="122" y="30">Mon 13</text>
      <text x="237" y="30">Tue 14</text>
      <text x="352" y="30">Wed 15</text>
      <text x="467" y="30">Thu 16</text>
      <text x="582" y="30">Fri 17</text>
      <text x="697" y="30">Sat 18</text>
      <text x="812" y="30">Sun 19</text>
    </g>

    <!-- Grid Lines & Time Column (65px wide) -->
    <path d="M65 50 L65 660 M180 50 L180 660 M295 50 L295 660 M410 50 L410 660 M525 50 L525 660 M640 50 L640 660 M755 50 L755 660" stroke="#F1F5F9" stroke-width="1" />
    
    <!-- Rows (Every 60px represents 1 hour, starting 08:00 AM) -->
    <!-- Displaying 08:00 to 17:00 (9 hours * 60px = 540px) -->
    <g font-size="12" fill="#94A3B8" text-anchor="end">
      <!-- 08:00 -->
      <text x="50" y="105">08:00</text>
      <line x1="65" y1="100" x2="870" y2="100" stroke="#E2E8F0" stroke-width="1" />
      
      <!-- 09:00 -->
      <text x="50" y="165">09:00</text>
      <line x1="65" y1="160" x2="870" y2="160" stroke="#F1F5F9" stroke-width="1" />

      <!-- 10:00 -->
      <text x="50" y="225">10:00</text>
      <line x1="65" y1="220" x2="870" y2="220" stroke="#E2E8F0" stroke-width="1" />

      <!-- 11:00 -->
      <text x="50" y="285">11:00</text>
      <line x1="65" y1="280" x2="870" y2="280" stroke="#F1F5F9" stroke-width="1" />

      <!-- 12:00 -->
      <text x="50" y="345">12:00</text>
      <line x1="65" y1="340" x2="870" y2="340" stroke="#E2E8F0" stroke-width="1" />

      <!-- 13:00 -->
      <text x="50" y="405">13:00</text>
      <line x1="65" y1="400" x2="870" y2="400" stroke="#F1F5F9" stroke-width="1" />

      <!-- 14:00 -->
      <text x="50" y="465">14:00</text>
      <line x1="65" y1="460" x2="870" y2="460" stroke="#E2E8F0" stroke-width="1" />

      <!-- 15:00 -->
      <text x="50" y="525">15:00</text>
      <line x1="65" y1="520" x2="870" y2="520" stroke="#F1F5F9" stroke-width="1" />

      <!-- 16:00 -->
      <text x="50" y="585">16:00</text>
      <line x1="65" y1="580" x2="870" y2="580" stroke="#E2E8F0" stroke-width="1" />

      <!-- 17:00 -->
      <text x="50" y="645">17:00</text>
      <line x1="65" y1="640" x2="870" y2="640" stroke="#F1F5F9" stroke-width="1" />
    </g>

    <!-- SCHEDULE SHIFTS / BLOCKS -->
    
    <!-- Monday Shift: 08:00 - 12:00 (Y starts at 100, height 240px for 4 hours) -->
    <g transform="translate(69, 100)" class="btn-hover">
      <rect x="0" y="0" width="107" height="240" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="240" rx="2" fill="#10B981" />
      <text x="12" y="20" font-size="12" font-weight="600" fill="#065F46">Morning Shift</text>
      <text x="12" y="38" font-size="11" fill="#047857">08:00 - 12:00</text>
      <text x="12" y="56" font-size="11" fill="#047857">Room 204</text>
    </g>

    <!-- Wednesday Shift: 08:00 - 12:00 -->
    <g transform="translate(299, 100)" class="btn-hover">
      <rect x="0" y="0" width="107" height="240" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="240" rx="2" fill="#10B981" />
      <text x="12" y="20" font-size="12" font-weight="600" fill="#065F46">Morning Shift</text>
      <text x="12" y="38" font-size="11" fill="#047857">08:00 - 12:00</text>
      <text x="12" y="56" font-size="11" fill="#047857">Room 204</text>
    </g>

    <!-- Monday Shift 2: 13:00 - 17:00 (Y starts at 400, height 240px) -->
    <g transform="translate(69, 400)" class="btn-hover">
      <rect x="0" y="0" width="107" height="240" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="240" rx="2" fill="#3B82F6" />
      <text x="12" y="20" font-size="12" font-weight="600" fill="#1E40AF">Evening Shift</text>
      <text x="12" y="38" font-size="11" fill="#1D4ED8">13:00 - 17:00</text>
      <text x="12" y="56" font-size="11" fill="#1D4ED8">Room 204</text>
    </g>

    <!-- Thursday Shift: 10:00 - 16:00 (Y starts at 220, height 360px for 6 hours) -->
    <g transform="translate(414, 220)" class="btn-hover">
      <rect x="0" y="0" width="107" height="360" rx="6" fill="#FDF4FF" stroke="#D946EF" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="360" rx="2" fill="#D946EF" />
      <text x="12" y="20" font-size="12" font-weight="600" fill="#86198F">Full Day Shift</text>
      <text x="12" y="38" font-size="11" fill="#A21CAF">10:00 - 16:00</text>
      <text x="12" y="56" font-size="11" fill="#A21CAF">Room 105</text>
    </g>
  </g>
</svg>
