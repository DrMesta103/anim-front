<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Defs for Shadows and Gradients -->
  <defs>
    <filter id="shadow" x="0" y="0" width="1200" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2F3E46" flood-opacity="0.04"/>
    </filter>
    <filter id="btn-shadow" x="0" y="0" width="160" height="60" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2F3E46" flood-opacity="0.1"/>
    </filter>
    <filter id="block-shadow" x="-5" y="-5" width="130" height="260" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2F3E46" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F0F4F2"/>

  <!-- ========================================== -->
  <!-- SIDEBAR (Matching Theme)                   -->
  <!-- ========================================== -->
  <rect width="260" height="800" fill="white"/>
  <rect x="259" y="0" width="1" height="800" fill="#CAD2C5"/>

  <!-- Logo -->
  <rect x="30" y="40" width="40" height="40" rx="10" fill="#CAD2C5"/>
  <path d="M42 52C42 50.8954 42.8954 50 44 50H56C57.1046 50 58 50.8954 58 52V68C58 69.1046 57.1046 70 56 70H44C42.8954 70 42 69.1046 42 68V52Z" stroke="#52796F" stroke-width="2"/>
  <text x="85" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">SageClinic</text>

  <!-- Sidebar Items -->
  <text x="70" y="162" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Dashboard</text>
  <text x="70" y="222" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Appts. Management</text>

  <!-- Active State: Doctor Availability -->
  <rect x="20" y="260" width="220" height="50" rx="12" fill="#52796F"/>
  <text x="70" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">Doctor Availability</text>
  <circle cx="45" cy="285" r="3" fill="white"/>

  <!-- Other Items -->
  <text x="70" y="362" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Patients List</text>
  <text x="70" y="422" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Cancellations</text>
  <text x="70" y="482" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Daily Reports</text>

  <!-- ========================================== -->
  <!-- TOP BAR                                    -->
  <!-- ========================================== -->
  <!-- Back Button to Directory -->
  <g style="cursor: pointer;">
    <rect x="290" y="40" width="30" height="30" rx="8" fill="#E8F4F1"/>
    <text x="305" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#52796F" text-anchor="middle">←</text>
    <text x="330" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#52796F">Back to Directory</text>
  </g>
  
  <text x="500" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">|</text>
  <text x="520" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">Schedule &amp; Shifts</text>

  <circle cx="1130" cy="55" r="20" fill="#CAD2C5"/>
  <text x="1100" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46" text-anchor="end">Sarah (Sec)</text>

  <!-- ========================================== -->
  <!-- MAIN CONTAINER                             -->
  <!-- ========================================== -->
  <rect x="290" y="95" width="880" height="680" rx="20" fill="white" filter="url(#shadow)"/>

  <!-- Header: Doctor Profile & Actions -->
  <circle cx="340" cy="145" r="24" fill="#E8F4F1"/>
  <text x="340" y="151" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#52796F" text-anchor="middle">AV</text>
  
  <text x="380" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F3E46">Dr. Alice Vance</text>
  <text x="380" y="160" font-family="Arial, sans-serif" font-size="13" fill="#84A98C">Head of Cardiology  •  Staff ID: #4092</text>

  <!-- Quick Stats -->
  <rect x="620" y="125" width="1" height="40" fill="#E2E8E4"/>
  <text x="640" y="140" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Weekly Hours</text>
  <text x="640" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F3E46">36h 00m</text>

  <rect x="740" y="125" width="1" height="40" fill="#E2E8E4"/>
  <text x="760" y="140" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Status</text>
  <circle cx="766" cy="155" r="4" fill="#52796F"/>
  <text x="776" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46">On Duty</text>

  <!-- Actions -->
  <rect x="910" y="125" width="110" height="40" rx="10" fill="#FAFCFB" stroke="#E2E8E4" stroke-width="1"/>
  <text x="965" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2F3E46" text-anchor="middle">Add Leave</text>

  <rect x="1030" y="125" width="110" height="40" rx="10" fill="#52796F" filter="url(#btn-shadow)"/>
  <text x="1085" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Edit Shifts</text>

  <rect x="290" y="190" width="880" height="1" fill="#E2E8E4"/>

  <!-- ========================================== -->
  <!-- CALENDAR CONTROLS                          -->
  <!-- ========================================== -->
  <rect x="320" y="215" width="30" height="30" rx="8" fill="#F0F4F2"/>
  <text x="335" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46" text-anchor="middle">&lt;</text>
  
  <text x="365" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2F3E46">Apr 06 - Apr 12, 2026</text>
  
  <rect x="525" y="215" width="30" height="30" rx="8" fill="#F0F4F2"/>
  <text x="540" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F3E46" text-anchor="middle">&gt;</text>

  <!-- View Toggle -->
  <rect x="940" y="210" width="200" height="40" rx="10" fill="#F0F4F2"/>
  <rect x="1008" y="214" width="64" height="32" rx="8" fill="white" filter="url(#btn-shadow)"/>
  <text x="974" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#84A98C" text-anchor="middle">Day</text>
  <text x="1040" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2F3E46" text-anchor="middle">Week</text>
  <text x="1106" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#84A98C" text-anchor="middle">Month</text>

  <!-- ========================================== -->
  <!-- WEEKLY GRID                                -->
  <!-- ========================================== -->
  <!-- Coordinates: 
       Start X: 370. Col width: 110.
       Time Y start: 310. Row height: 45px per hour.
  -->
  
  <!-- Day Headers -->
  <g fill="#84A98C" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <!-- Current Day Highlight -->
    <rect x="370" y="260" width="110" height="40" rx="8" fill="#E8F4F1"/>
    <text x="425" y="278" font-weight="bold" fill="#52796F">Mon</text>
    <text x="425" y="294" font-weight="bold" fill="#52796F" font-size="14">06</text>

    <text x="535" y="278">Tue</text>
    <text x="535" y="294" font-weight="bold" fill="#2F3E46" font-size="14">07</text>

    <text x="645" y="278">Wed</text>
    <text x="645" y="294" font-weight="bold" fill="#2F3E46" font-size="14">08</text>

    <text x="755" y="278">Thu</text>
    <text x="755" y="294" font-weight="bold" fill="#2F3E46" font-size="14">09</text>

    <text x="865" y="278">Fri</text>
    <text x="865" y="294" font-weight="bold" fill="#2F3E46" font-size="14">10</text>

    <text x="975" y="278">Sat</text>
    <text x="975" y="294" font-weight="bold" fill="#2F3E46" font-size="14">11</text>

    <text x="1085" y="278">Sun</text>
    <text x="1085" y="294" font-weight="bold" fill="#2F3E46" font-size="14">12</text>
  </g>

  <!-- Horizontal Grid Lines & Time Labels (Every Hour, 8 AM to 5 PM) -->
  <g stroke="#E2E8E4" stroke-width="1" stroke-dasharray="4 4">
    <!-- 08:00 -->
    <text x="350" y="325" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="end" stroke="none">08:00</text>
    <line x1="360" y1="320" x2="1140" y2="320"/>
    <!-- 09:00 -->
    <text x="350" y="370" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="end" stroke="none">09:00</text>
    <line x1="360" y1="365" x2="1140" y2="365"/>
    <!-- 10:00 -->
    <text x="350" y="415" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="end" stroke="none">10:00</text>
    <line x1="360" y1="410" x2="1140" y2="410"/>
    <!-- 11:00 -->
    <text x="350" y="460" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="end" stroke="none">11:00</text>
    <line x1="360" y1="455" x2="1140" y2="455"/>
    <!-- 12:00 -->
    <text x="350" y="505" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="end" stroke="none">12:00</text>
    <line x1="360" y1="500" x2="1140" y2="500"/>
    <!-- 13:00 -->
    <text x="350" y="550" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="end" stroke="none">13:00</text>
    <line x1="360" y1="545" x2="1140" y2="545"/>
    <!-- 14:00 -->
    <text x="350" y="595" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="end" stroke="none">14:00</text>
    <line x1="360" y1="590" x2="1140" y2="590"/>
    <!-- 15:00 -->
    <text x="350" y="640" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="end" stroke="none">15:00</text>
    <line x1="360" y1="635" x2="1140" y2="635"/>
    <!-- 16:00 -->
    <text x="350" y="685" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="end" stroke="none">16:00</text>
    <line x1="360" y1="680" x2="1140" y2="680"/>
    <!-- 17:00 -->
    <text x="350" y="730" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="end" stroke="none">17:00</text>
    <line x1="360" y1="725" x2="1140" y2="725"/>
  </g>

  <!-- Vertical Column Backgrounds (for Weekend) -->
  <rect x="920" y="310" width="110" height="430" fill="#FAFCFB" opacity="0.5"/>
  <rect x="1030" y="310" width="110" height="430" fill="#FAFCFB" opacity="0.5"/>

  <!-- ========================================== -->
  <!-- SHIFT BLOCKS (45px per hour)               -->
  <!-- ========================================== -->
  
  <!-- MONDAY: Clinic Consultation (08:00 - 12:00) -->
  <!-- y = 320, height = 4 * 45 = 180 -->
  <g transform="translate(372, 322)" filter="url(#block-shadow)">
    <rect width="106" height="176" rx="6" fill="#E8F4F1" stroke="#52796F" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="176" rx="2" fill="#52796F"/>
    <text x="12" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Clinic Consult.</text>
    <text x="12" y="36" font-family="Arial, sans-serif" font-size="10" fill="#52796F">08:00 - 12:00</text>
    <text x="12" y="52" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Room 102</text>
    <!-- Avatar / Icon indicator -->
    <circle cx="20" cy="156" r="8" fill="white"/>
    <text x="20" y="160" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#52796F" text-anchor="middle">👤</text>
    <text x="35" y="160" font-family="Arial, sans-serif" font-size="9" fill="#52796F">8 Patients</text>
  </g>

  <!-- MONDAY: Lunch (12:00 - 13:00) -->
  <!-- y = 500, height = 45 -->
  <g transform="translate(372, 502)">
    <rect width="106" height="41" rx="6" fill="#F0F4F2" stroke="#CAD2C5" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="53" y="25" font-family="Arial, sans-serif" font-size="11" fill="#84A98C" text-anchor="middle" font-style="italic">Break</text>
  </g>

  <!-- MONDAY: Ward Rounds (13:00 - 16:00) -->
  <!-- y = 545, height = 3 * 45 = 135 -->
  <g transform="translate(372, 547)" filter="url(#block-shadow)">
    <rect width="106" height="131" rx="6" fill="#F4F6FB" stroke="#4A6572" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="131" rx="2" fill="#4A6572"/>
    <text x="12" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Ward Rounds</text>
    <text x="12" y="36" font-family="Arial, sans-serif" font-size="10" fill="#4A6572">13:00 - 16:00</text>
    <text x="12" y="52" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">East Wing, Fl 3</text>
  </g>

  <!-- TUESDAY: Surgery (09:00 - 14:30) -->
  <!-- y = 365, height = 5.5 * 45 = 247.5 -->
  <g transform="translate(482, 367)" filter="url(#block-shadow)">
    <rect width="106" height="243" rx="6" fill="#FDF3E1" stroke="#E68A00" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="243" rx="2" fill="#E68A00"/>
    <text x="12" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Surgery</text>
    <text x="12" y="36" font-family="Arial, sans-serif" font-size="10" fill="#E68A00">09:00 - 14:30</text>
    <text x="12" y="52" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">OR #2</text>
    
    <rect x="12" y="65" width="80" height="20" rx="4" fill="white" opacity="0.8"/>
    <text x="18" y="79" font-family="Arial, sans-serif" font-size="9" fill="#2F3E46"> CABG Proc.</text>
    
    <rect x="12" y="90" width="80" height="20" rx="4" fill="white" opacity="0.8"/>
    <text x="18" y="104" font-family="Arial, sans-serif" font-size="9" fill="#2F3E46"> Valve Repair</text>
  </g>

  <!-- WEDNESDAY: Admin / Research (10:00 - 15:00) -->
  <!-- y = 410, height = 5 * 45 = 225 -->
  <g transform="translate(592, 412)" filter="url(#block-shadow)">
    <rect width="106" height="221" rx="6" fill="#FAFCFB" stroke="#CAD2C5" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="221" rx="2" fill="#CAD2C5"/>
    <text x="12" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Admin / R&amp;D</text>
    <text x="12" y="36" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">10:00 - 15:00</text>
    <text x="12" y="52" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Office 4B</text>
  </g>

  <!-- THURSDAY: Clinic Consultation (08:00 - 13:00) -->
  <!-- y = 320, height = 5 * 45 = 225 -->
  <g transform="translate(702, 322)" filter="url(#block-shadow)">
    <rect width="106" height="221" rx="6" fill="#E8F4F1" stroke="#52796F" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="221" rx="2" fill="#52796F"/>
    <text x="12" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Clinic Consult.</text>
    <text x="12" y="36" font-family="Arial, sans-serif" font-size="10" fill="#52796F">08:00 - 13:00</text>
    <text x="12" y="52" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Room 102</text>
  </g>

  <!-- THURSDAY: On-Call (14:00 - 17:00+) -->
  <!-- y = 590, height = 3 * 45 = 135 -->
  <g transform="translate(702, 592)" filter="url(#block-shadow)">
    <rect width="106" height="131" rx="6" fill="#FDF3E1" stroke="#E68A00" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="0" y="0" width="4" height="131" rx="2" fill="#E68A00"/>
    <text x="12" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">On-Call</text>
    <text x="12" y="36" font-family="Arial, sans-serif" font-size="10" fill="#E68A00">14:00 - 20:00</text>
    <text x="12" y="52" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Cardio ICU</text>
  </g>

  <!-- FRIDAY: Ward Rounds (08:00 - 11:00) -->
  <!-- y = 320, height = 3 * 45 = 135 -->
  <g transform="translate(812, 322)" filter="url(#block-shadow)">
    <rect width="106" height="131" rx="6" fill="#F4F6FB" stroke="#4A6572" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="131" rx="2" fill="#4A6572"/>
    <text x="12" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Ward Rounds</text>
    <text x="12" y="36" font-family="Arial, sans-serif" font-size="10" fill="#4A6572">08:00 - 11:00</text>
  </g>

  <!-- FRIDAY: Clinic Consultation (12:00 - 16:00) -->
  <!-- y = 500, height = 4 * 45 = 180 -->
  <g transform="translate(812, 502)" filter="url(#block-shadow)">
    <rect width="106" height="176" rx="6" fill="#E8F4F1" stroke="#52796F" stroke-width="2"/>
    <rect x="0" y="0" width="4" height="176" rx="2" fill="#52796F"/>
    <text x="12" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Clinic Consult.</text>
    <text x="12" y="36" font-family="Arial, sans-serif" font-size="10" fill="#52796F">12:00 - 16:00</text>
    <text x="12" y="52" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Room 102</text>
  </g>

  <!-- SATURDAY & SUNDAY: Off Duty (Text indication) -->
  <text x="975" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#CAD2C5" text-anchor="middle" transform="rotate(-90 975 450)">OFF DUTY</text>
  <text x="1085" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#CAD2C5" text-anchor="middle" transform="rotate(-90 1085 450)">OFF DUTY</text>

  <!-- Current Time Indicator Line (e.g., Monday 10:30 AM) -->
  <!-- X: 360 to 482 (Monday column), Y: 410 + (22.5) = 432.5 -->
  <g transform="translate(0, 432)">
    <circle cx="370" cy="0" r="4" fill="#F5A623"/>
    <line x1="374" y1="0" x2="480" y2="0" stroke="#F5A623" stroke-width="2" stroke-dasharray="2 2"/>
  </g>

</svg>
