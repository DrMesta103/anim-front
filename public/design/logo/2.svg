<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Robin Clinic Favicon
    A simplified logo combining a heart (care) and a wing (robin/swiftness).
    Designed for clarity at small sizes.
  -->
  <g>
    <!-- Left Half: The Heart (Represents Health & Care) -->
    <path d="M50 90 C 20 70, 10 45, 30 25 C 40 15, 50 30, 50 40 V 90 Z" fill="#52796F"/>
    
    <!-- Right Half: The Wing (Represents the Robin) -->
    <path d="M50 40 C 60 20, 95 20, 80 55 C 70 75, 50 70, 50 65 V 40 Z" fill="#D65A5A"/>
    
    <!-- Wing Accent (Adds depth and a nod to the darker feather color) -->
    <path d="M50 68 C 65 65, 75 75, 65 85 C 60 90, 50 80, 50 75 V 68 Z" fill="#2F3E46"/>
  </g>
</svg>
