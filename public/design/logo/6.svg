<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient based on #52796f -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a9388" />
      <stop offset="100%" stop-color="#52796f" />
    </linearGradient>
    
    <!-- Warm, calming accent gradient for the Robin Wing / Healing Leaf -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a261" />
      <stop offset="100%" stop-color="#e76f51" />
    </linearGradient>

    <!-- Soft drop shadow for modern depth on high-res screens -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Squircle (Rounded Rectangle standard for Favicons) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Main Logo Elements -->
  <g filter="url(#shadow)">
    <!-- The Wing / Leaf (Leg of the 'R') -->
    <path d="M 240 300 A 100 100 0 0 1 370 400 A 100 100 0 0 1 240 300 Z" fill="url(#leafGrad)" />
    
    <!-- The Geometric 'R' Stem and Loop -->
    <path d="M 160 360 L 160 140 H 260 A 90 90 0 0 1 260 320 H 160" fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
