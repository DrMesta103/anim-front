<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Base Plate: 
    A clean, pristine circular background. 
    This ensures the favicon looks perfect and maintains contrast in both light and dark mode browser tabs.
  -->
  <circle cx="50" cy="50" r="48" fill="#F4F8F7" />

  <!-- 
    Geometric Robin Silhouette:
    Constructed using smooth, mathematical arcs for an ultra-modern, trustworthy corporate aesthetic.
  -->
  <path d="M 80 35 
           A 20 20 0 0 0 55 15 
           A 40 40 0 0 0 15 65 
           L 5 85 
           L 25 80 
           A 30 30 0 0 0 70 50 
           Q 75 40, 80 35" 
        fill="#2F3E46" />

  <!-- 
    The Signature Robin Breast:
    A sharp, precise crescent overlay using the clinic's accent red.
  -->
  <path d="M 25 80 
           A 30 30 0 0 0 70 50 
           A 35 35 0 0 1 25 80 Z" 
        fill="#D65A5A" />

  <!-- 
    The Eye:
    A simple dot gives the geometric shape life and instant recognition as a bird.
  -->
  <circle cx="62" cy="26" r="2.5" fill="#F4F8F7" />

  <!-- 
    Negative Space Medical Cross:
    Carved cleanly out of the thickest part of the wing. 
    It explicitly marks it as a clinic without cluttering the design with text.
  -->
  <path d="M 34 39 
           H 38 V 43 
           H 42 V 47 
           H 38 V 51 
           H 34 V 47 
           H 30 V 43 
           H 34 Z" 
        fill="#F4F8F7" />

</svg>
