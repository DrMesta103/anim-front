<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6b9e92;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#52796f;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="brainGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#cae8e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8d5cc;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" />
  <circle cx="32" cy="32" r="31" fill="none" stroke="#3d5c54" stroke-width="1.5" />

  <!-- Brain Shape (stylized, two hemispheres) -->
  <!-- Left Hemisphere -->
  <path d="
    M32 18
    C28 16, 20 17, 18 22
    C15 26, 15 30, 17 33
    C15 36, 16 40, 19 42
    C21 44, 25 44, 27 43
    C28 44, 30 45, 32 44
    L32 18Z
  " fill="url(#brainGrad)" opacity="0.95"/>

  <!-- Right Hemisphere -->
  <path d="
    M32 18
    C36 16, 44 17, 46 22
    C49 26, 49 30, 47 33
    C49 36, 48 40, 45 42
    C43 44, 39 44, 37 43
    C36 44, 34 45, 32 44
    L32 18Z
  " fill="url(#brainGrad)" opacity="0.85"/>

  <!-- Brain Center Line -->
  <line x1="32" y1="18" x2="32" y2="44" stroke="#52796f" stroke-width="1" opacity="0.6"/>

  <!-- Brain Folds - Left -->
  <path d="M22 24 Q19 27 21 30" fill="none" stroke="#52796f" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M20 31 Q18 34 20 37" fill="none" stroke="#52796f" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M24 38 Q22 40 24 42" fill="none" stroke="#52796f" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Brain Folds - Right -->
  <path d="M42 24 Q45 27 43 30" fill="none" stroke="#52796f" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M44 31 Q46 34 44 37" fill="none" stroke="#52796f" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M40 38 Q42 40 40 42" fill="none" stroke="#52796f" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Psi Symbol (ψ) - Psychology Universal Symbol -->
  <g transform="translate(32, 50) scale(0.7)" fill="none" stroke="#e8f4f1" stroke-width="2" stroke-linecap="round">
    <!-- Psi center vertical line -->
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#e8f4f1" stroke-width="2"/>
    <!-- Psi left arc -->
    <path d="M-5 -4 Q-7 0 -5 4" stroke="#e8f4f1" stroke-width="2" fill="none"/>
    <!-- Psi right arc -->
    <path d="M5 -4 Q7 0 5 4" stroke="#e8f4f1" stroke-width="2" fill="none"/>
    <!-- Psi base line -->
    <line x1="-4" y1="6" x2="4" y2="6" stroke="#e8f4f1" stroke-width="2"/>
  </g>

  <!-- Small Robin Bird Silhouette on top of brain -->
  <g transform="translate(32, 13)">
    <!-- Bird body -->
    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#e8f4f1" opacity="0.9"/>
    <!-- Bird head -->
    <circle cx="3.5" cy="-2.5" r="2.2" fill="#e8f4f1" opacity="0.9"/>
    <!-- Robin red breast -->
    <ellipse cx="0" cy="0.5" rx="2.5" ry="1.8" fill="#c17f6b" opacity="0.85"/>
    <!-- Beak -->
    <path d="M5.5 -2.5 L7.5 -2 L5.5 -1.5Z" fill="#d4a96a"/>
    <!-- Eye -->
    <circle cx="4.2" cy="-3" r="0.5" fill="#3d5c54"/>
    <!-- Wing hint -->
    <path d="M-3.5 -0.5 Q-1 -3 1 -1" fill="none" stroke="#52796f" stroke-width="0.8" opacity="0.6"/>
    <!-- Tail -->
    <path d="M-4 0 L-7 1.5 M-4 0.5 L-7 2.5" stroke="#c8ddd9" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- "R" Letter subtle integration -->
  <text x="26" y="42" font-family="Georgia, serif" font-size="7" font-weight="bold"
        fill="#52796f" opacity="0.5" letter-spacing="1">R</text>
</svg>
