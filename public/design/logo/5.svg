<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    ROBIN CLINIC - PROFESSIONAL FAVICON
    A literal, clean, and bold silhouette of a Robin.
  -->

  <!-- 
    1. Base Robin Silhouette (Head, Back, and Tail)
    Uses the clinic's dark slate color for a strong, professional corporate presence.
  -->
  <path d="M 55 15 
           C 70 15, 80 25, 82 35 
           L 98 38 
           L 82 45 
           C 85 65, 70 90, 45 90 
           L 5 85 
           L 15 70 
           C 30 65, 35 50, 40 45 
           C 45 30, 45 15, 55 15 Z" 
        fill="#2F3E46" />

  <!-- 
    2. The Signature Robin Red Breast
    Maps perfectly to the front curve of the bird to make it undeniably a robin.
  -->
  <path d="M 82 45 
           C 85 65, 70 90, 45 90 
           C 65 85, 75 65, 72 45 Z" 
        fill="#D65A5A" />

  <!-- 
    3. The Folded Wing
    Added in the clinic's Sage Green to give the bird structure and depth.
  -->
  <path d="M 40 45 
           C 60 45, 65 65, 45 82 
           C 30 75, 25 55, 40 45 Z" 
        fill="#52796F" />

  <!-- 
    4. The Clinic Mark (Medical Cross)
    A crisp white medical cross carved directly into the wing.
    Bold and thick enough to be readable at 16x16 pixels.
  -->
  <path d="M 39 58 
           h 5 v -5 
           h 4 v 5 
           h 5 v 4 
           h -5 v 5 
           h -4 v -5 
           h -5 v -4 z" 
        fill="#FFFFFF" />

  <!-- 
    5. The Eye
    Simple, bright, and brings the bird profile to life.
  -->
  <circle cx="70" cy="30" r="3.5" fill="#FFFFFF" />

</svg>
