<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Subtle gradient based on the requested theme color #52796f -->
    <linearGradient id="themeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#669186" />
      <stop offset="100%" stop-color="#52796f" />
    </linearGradient>

    <!-- Drop shadow for the icon to give it depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Squircle (Great for Favicons) -->
  <rect width="256" height="256" rx="56" fill="url(#themeGradient)" />

  <!-- 
    Hybrid Symbol: The Letter 'R' + Psychology Psi (Ψ) 
    - The central line is the spine of both the 'R' and the 'Ψ'.
    - The left curve acts as the open arm of the 'Ψ' (representing open mind / therapy).
    - The right curve closes the loop to form the 'R', seamlessly integrating the brand name.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    
    <!-- Central Stem (Spine of the mind / Stem of the R) -->
    <path d="M128,50 L128,206" />

    <!-- Left Arm (The open, receptive side of the Psychology Psi symbol) -->
    <path d="M64,75 C64,150 90,150 128,150" />

    <!-- Right Loop (Forms the top of the 'R' while mirroring the Psi shape) -->
    <path d="M128,75 C190,75 190,150 128,150" />

    <!-- Right Leg (Completes the 'R' representing forward movement and growth) -->
    <path d="M145,150 L184,206" />
    
    <!-- Abstract Mind/Growth Dot (Adds a subtle touch of a blooming mind) -->
    <circle cx="128" cy="38" r="4" fill="#ffffff" stroke="none" />
  </g>
</svg>
