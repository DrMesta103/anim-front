<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Fonts & Styling -->
    <style>
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300&display=swap');
        
        .name-text {
          font-family: 'Great Vibes', cursive;
          font-size: 150px;
          fill: url(#textGlow);
        }
        
        .subtitle {
          font-family: 'Montserrat', sans-serif;
          font-size: 16px;
          fill: #A8DADC;
          letter-spacing: 12px;
          opacity: 0.9;
        }
        
        .bubble {
          fill: url(#bubbleGrad);
        }
        
        .sparkle {
          fill: #FFFFFF;
          opacity: 0.8;
        }
      ]]>
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E1FD" />
      <stop offset="40%" stop-color="#0096C7" />
      <stop offset="100%" stop-color="#023E8A" />
    </linearGradient>

    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0FFFF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CAF0F8" />
    </linearGradient>

    <radialGradient id="bubbleGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#48CAE4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0077B6" stop-opacity="0.8" />
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#001845" stop-opacity="0.5" />
    </radialGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#001233" flood-opacity="0.5"/>
    </filter>

    <filter id="magicGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Lovely Heart Bubble Path -->
    <path id="heartBubble" d="M 0 -5 C 8 -15, 20 -10, 20 0 C 20 15, 0 25, 0 35 C 0 25, -20 15, -20 0 C -20 -10, -8 -15, 0 -5 Z" fill="url(#bubbleGrad)"/>
  </defs>

  <!-- Deep Ocean Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Sun Rays Piercing the Water -->
  <g fill="#ffffff" opacity="0.08">
    <polygon points="150,-50 250,-50 450,550 -50,550" />
    <polygon points="350,-50 480,-50 750,550 250,550" opacity="0.05" />
    <polygon points="600,-50 700,-50 950,550 550,550" />
    <polygon points="250,-50 380,-50 200,550 0,550" opacity="0.06" />
  </g>

  <!-- Ocean Waves at the bottom -->
  <path d="M 0 360 C 200 420 400 310 800 390 L 800 500 L 0 500 Z" fill="#0077B6" opacity="0.5" />
  <path d="M 0 410 C 300 360 500 460 800 390 L 800 500 L 0 500 Z" fill="#0096C7" opacity="0.6" />
  <path d="M 0 440 C 250 490 550 410 800 460 L 800 500 L 0 500 Z" fill="#48CAE4" opacity="0.7" />
  <path d="M 0 470 C 200 450 600 510 800 470 L 800 500 L 0 500 Z" fill="#90E0EF" opacity="0.8" />

  <!-- Seaweeds / Corals -->
  <g stroke-linecap="round" fill="none">
    <!-- Left Bottom Corner -->
    <path d="M 40 500 Q 20 440 50 390 T 30 290" stroke="#00B4D8" stroke-width="14" opacity="0.6" />
    <path d="M 40 450 Q 70 410 60 370" stroke="#48CAE4" stroke-width="8" opacity="0.7" />
    <path d="M 20 500 Q 70 450 40 410 T 70 330" stroke="#90E0EF" stroke-width="10" opacity="0.5" />

    <!-- Right Bottom Corner -->
    <path d="M 760 500 Q 780 440 750 390 T 770 290" stroke="#00B4D8" stroke-width="14" opacity="0.6" />
    <path d="M 760 450 Q 730 410 740 370" stroke="#48CAE4" stroke-width="8" opacity="0.7" />
    <path d="M 780 500 Q 730 450 760 410 T 730 330" stroke="#90E0EF" stroke-width="10" opacity="0.5" />
  </g>

  <!-- Spherical Water Bubbles -->
  <g>
    <!-- Big Bubbles -->
    <circle cx="120" cy="380" r="20" class="bubble" />
    <circle cx="700" cy="280" r="24" class="bubble" />
    <circle cx="280" cy="150" r="16" class="bubble" />
    <circle cx="580" cy="420" r="18" class="bubble" />

    <!-- Medium Bubbles -->
    <circle cx="80" cy="180" r="11" class="bubble" />
    <circle cx="740" cy="140" r="13" class="bubble" />
    <circle cx="450" cy="350" r="10" class="bubble" />
    <circle cx="200" cy="270" r="12" class="bubble" />
    <circle cx="630" cy="160" r="11" class="bubble" />

    <!-- Small Bubbles -->
    <circle cx="150" cy="310" r="6" class="bubble" />
    <circle cx="180" cy="430" r="7" class="bubble" />
    <circle cx="670" cy="360" r="6" class="bubble" />
    <circle cx="720" cy="220" r="8" class="bubble" />
    <circle cx="330" cy="110" r="5" class="bubble" />
    <circle cx="530" cy="380" r="7" class="bubble" />
    <circle cx="490" cy="240" r="5" class="bubble" />
  </g>

  <!-- Lovely Heart Bubbles -->
  <g>
    <use href="#heartBubble" transform="translate(230, 210) scale(0.6)" opacity="0.9" />
    <use href="#heartBubble" transform="translate(600, 310) scale(0.4)" opacity="0.7" />
    <use href="#heartBubble" transform="translate(420, 110) scale(0.5)" opacity="0.8" />
    <use href="#heartBubble" transform="translate(140, 240) scale(0.3)" opacity="0.6" />
    <use href="#heartBubble" transform="translate(680, 180) scale(0.5)" opacity="0.9" />
  </g>

  <!-- Sparkles / Magical Stars -->
  <g class="sparkle">
    <path d="M 220 100 Q 220 110 230 110 Q 220 110 220 120 Q 220 110 210 110 Q 220 110 220 100 Z" />
    <path d="M 590 200 Q 590 210 600 210 Q 590 210 590 220 Q 590 210 580 210 Q 590 210 590 200 Z" transform="scale(0.8) translate(150, 50)" />
    <path d="M 370 70 Q 370 80 380 80 Q 370 80 370 90 Q 370 80 360 80 Q 370 80 370 70 Z" transform="scale(1.2) translate(-60, -10)" />
    <path d="M 540 120 Q 540 130 550 130 Q 540 130 540 140 Q 540 130 530 130 Q 540 130 540 120 Z" />
    <path d="M 160 280 Q 160 285 165 285 Q 160 285 160 290 Q 160 285 155 285 Q 160 285 160 280 Z" />
  </g>

  <!-- Central Name and Typography -->
  <g filter="url(#magicGlow)">
    <text x="400" y="275" text-anchor="middle" class="name-text" filter="url(#dropShadow)">aynaz</text>
    <text x="400" y="340" text-anchor="middle" class="subtitle">AQUA OF LOVE</text>
  </g>
  
  <!-- Outer Shadow Vignette to focus on the center -->
  <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />
</svg>
