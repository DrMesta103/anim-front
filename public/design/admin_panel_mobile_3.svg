<svg width="390" height="1200" viewBox="0 0 390 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="390" height="1200" fill="#F0F4F2"/>

  <!-- Shadow Filter Definition -->
  <defs>
    <filter id="shadow" x="-20" y="-20" width="450" height="1250" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#2F3E46" flood-opacity="0.05"/>
    </filter>
    <filter id="soft-shadow" x="-10" y="-10" width="400" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2F3E46" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- NAVBAR (MOBILE) -->
  <rect width="390" height="80" fill="white" filter="url(#shadow)"/>
  
  <!-- Hamburger Menu Icon -->
  <path d="M20 30H44M20 40H44M20 50H44" stroke="#52796F" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Logo (Centered) -->
  <rect x="110" y="25" width="30" height="30" rx="8" fill="#CAD2C5"/>
  <path d="M118 34C118 33.4477 118.448 33 119 33H128C128.552 33 129 33.4477 129 34V46C129 46.5523 128.552 47 128 47H119C118.448 47 118 46.5523 118 46V34Z" stroke="#52796F" stroke-width="1.5"/>
  <text x="150" y="46" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F3E46">SageClinic</text>
  
  <!-- Admin Profile -->
  <circle cx="350" cy="40" r="16" fill="#CAD2C5"/>

  <!-- PAGE TITLE -->
  <text x="20" y="125" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2F3E46">Admin Dashboard</text>

  <!-- STATS GRID (MOBILE ADAPTED) -->
  <!-- Box 1: Doctors -->
  <rect x="20" y="150" width="165" height="100" rx="20" fill="white" filter="url(#soft-shadow)"/>
  <text x="35" y="185" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Total Doctors</text>
  <text x="35" y="220" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2F3E46">24</text>

  <!-- Box 2: Rooms -->
  <rect x="205" y="150" width="165" height="100" rx="20" fill="white" filter="url(#soft-shadow)"/>
  <text x="220" y="185" font-family="Arial, sans-serif" font-size="12" fill="#84A98C">Active Rooms</text>
  <text x="220" y="220" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2F3E46">12 / 15</text>

  <!-- Box 3: Patients (Full Width) -->
  <rect x="20" y="270" width="350" height="90" rx="20" fill="white" filter="url(#soft-shadow)"/>
  <text x="40" y="305" font-family="Arial, sans-serif" font-size="13" fill="#84A98C">Daily Patients</text>
  <text x="40" y="335" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2F3E46">148</text>

  <!-- MAIN CHART AREA -->
  <rect x="20" y="380" width="350" height="220" rx="25" fill="white" filter="url(#soft-shadow)"/>
  <text x="40" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F3E46">Weekly Schedule Traffic</text>
  <!-- Scaled Graph Line -->
  <path d="M40 550 Q 100 500, 140 520 T 220 480 T 290 500 T 350 460" stroke="#52796F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M40 550 Q 100 500, 140 520 T 220 480 T 290 500 T 350 460 V 570 H 40 Z" fill="#52796F" opacity="0.1"/>

  <!-- REMINDERS SECTION -->
  <rect x="20" y="620" width="350" height="240" rx="25" fill="#CAD2C5" opacity="0.4"/>
  <text x="40" y="660" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F3E46">Reminders</text>

  <!-- Reminder 1 -->
  <rect x="35" y="680" width="320" height="50" rx="12" fill="white"/>
  <text x="50" y="700" font-family="Arial, sans-serif" font-size="12" fill="#2F3E46">Room 4 Maintenance</text>
  <text x="50" y="718" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">Starts at 02:00 PM</text>

  <!-- Reminder 2 -->
  <rect x="35" y="740" width="320" height="50" rx="12" fill="white"/>
  <text x="50" y="760" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF4D4D">Canceled: Dr. Peterson</text>
  <text x="50" y="778" font-family="Arial, sans-serif" font-size="11" fill="#84A98C">Patient: Sarah Jenkins</text>

  <!-- RECENT SCHEDULES (MOBILE CARDS) -->
  <text x="20" y="905" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F3E46">Recent Active Schedules</text>

  <!-- Schedule Card 1 -->
  <rect x="20" y="925" width="350" height="110" rx="20" fill="white" filter="url(#soft-shadow)"/>
  <text x="40" y="955" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2F3E46">John Doe</text>
  <rect x="270" y="940" width="70" height="22" rx="11" fill="#52796F" fill-opacity="0.1"/>
  <text x="278" y="955" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#52796F">In Session</text>
  
  <text x="40" y="985" font-family="Arial, sans-serif" font-size="13" fill="#84A98C">Doctor:</text>
  <text x="95" y="985" font-family="Arial, sans-serif" font-size="13" fill="#2F3E46">Dr. Alice Vance</text>
  
  <text x="40" y="1010" font-family="Arial, sans-serif" font-size="13" fill="#84A98C">Room:</text>
  <text x="85" y="1010" font-family="Arial, sans-serif" font-size="13" fill="#2F3E46">Therapy 02</text>
  <text x="285" y="1010" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#52796F">10:30 AM</text>

  <!-- Schedule Card 2 -->
  <rect x="20" y="1055" width="350" height="110" rx="20" fill="white" filter="url(#soft-shadow)"/>
  <text x="40" y="1085" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2F3E46">Jane Smith</text>
  <rect x="270" y="1070" width="70" height="22" rx="11" fill="#CAD2C5"/>
  <text x="288" y="1085" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2F3E46">Waiting</text>
  
  <text x="40" y="1115" font-family="Arial, sans-serif" font-size="13" fill="#84A98C">Doctor:</text>
  <text x="95" y="1115" font-family="Arial, sans-serif" font-size="13" fill="#2F3E46">Dr. Robert Miles</text>
  
  <text x="40" y="1140" font-family="Arial, sans-serif" font-size="13" fill="#84A98C">Room:</text>
  <text x="85" y="1140" font-family="Arial, sans-serif" font-size="13" fill="#2F3E46">Consultation B</text>
  <text x="285" y="1140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#52796F">11:45 AM</text>

</svg>
