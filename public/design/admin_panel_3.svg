<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F0F4F2"/>

  <!-- SIDEBAR -->
  <rect width="260" height="800" fill="white"/>
  <rect x="259" y="0" width="1" height="800" fill="#CAD2C5"/> <!-- Border -->

  <!-- Logo -->
  <rect x="30" y="40" width="40" height="40" rx="10" fill="#CAD2C5"/>
  <path d="M42 52C42 50.8954 42.8954 50 44 50H56C57.1046 50 58 50.8954 58 52V68C58 69.1046 57.1046 70 56 70H44C42.8954 70 42 69.1046 42 68V52Z" stroke="#52796F" stroke-width="2"/>
  <text x="85" y="68" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F3E46">SageClinic</text>

  <!-- Sidebar Items -->
  <!-- Active State: Dashboard -->
  <rect x="20" y="130" width="220" height="50" rx="12" fill="#52796F"/>
  <text x="70" y="162" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">Dashboard</text>
  <circle cx="45" cy="155" r="3" fill="white"/>

  <!-- Other Items -->
  <text x="70" y="222" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Specialties</text>
  <text x="70" y="282" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Rooms</text>
  <text x="70" y="342" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Doctors</text>
  <text x="70" y="402" font-family="Arial, sans-serif" font-size="15" fill="#84A98C">Secretaries</text>

  <!-- TOP BAR -->
  <text x="290" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3E46">Admin Dashboard</text>
  <circle cx="1120" cy="55" r="20" fill="#CAD2C5"/>
  <text x="1020" y="60" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46" text-anchor="end">Pooya Admin</text>

  <!-- DASHBOARD CONTENT -->

  <!-- Stats Grid -->
  <!-- Box 1: Doctors -->
  <rect x="290" y="110" width="200" height="120" rx="25" fill="white" filter="url(#shadow)"/>
  <text x="320" y="150" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Total Doctors</text>
  <text x="320" y="195" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2F3E46">24</text>

  <!-- Box 2: Rooms -->
  <rect x="520" y="110" width="200" height="120" rx="25" fill="white" filter="url(#shadow)"/>
  <text x="550" y="150" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Active Rooms</text>
  <text x="550" y="195" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2F3E46">12 / 15</text>

  <!-- Box 3: Patients -->
  <rect x="750" y="110" width="200" height="120" rx="25" fill="white" filter="url(#shadow)"/>
  <text x="780" y="150" font-family="Arial, sans-serif" font-size="14" fill="#84A98C">Daily Patients</text>
  <text x="780" y="195" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2F3E46">148</text>

  <!-- Main Chart Area (Visual Representation) -->
  <rect x="290" y="260" width="660" height="300" rx="30" fill="white" filter="url(#shadow)"/>
  <text x="320" y="305" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F3E46">Weekly Schedule Traffic</text>
  <!-- Decorative Graph Line -->
  <path d="M320 480 Q 400 420, 480 450 T 640 380 T 800 410 T 920 340" stroke="#52796F" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M320 480 Q 400 420, 480 450 T 640 380 T 800 410 T 920 340 V 500 H 320 Z" fill="#52796F" opacity="0.1"/>

  <!-- Right Side: Reminders/Recent Canceled -->
  <rect x="980" y="110" width="190" height="450" rx="30" fill="#CAD2C5" opacity="0.4"/>

  <text x="1000" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F3E46">Reminders</text>

  <rect x="995" y="175" width="160" height="60" rx="15" fill="white"/>
  <text x="1005" y="200" font-family="Arial, sans-serif" font-size="11" fill="#2F3E46">Room 4 Maintenance</text>
  <text x="1005" y="218" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Starts at 02:00 PM</text>

  <rect x="995" y="245" width="160" height="60" rx="15" fill="white"/>
  <text x="1005" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FF4D4D">Canceled: Dr. Peterson</text>
  <text x="1005" y="288" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">Patient: Sarah Jenkins</text>

  <rect x="995" y="315" width="160" height="60" rx="15" fill="white"/>
  <text x="1005" y="340" font-family="Arial, sans-serif" font-size="11" fill="#2F3E46">Update Specialties</text>
  <text x="1005" y="358" font-family="Arial, sans-serif" font-size="10" fill="#84A98C">3 doctors pending</text>

  <!-- BOTTOM SECTION: Recent Schedules Table -->
  <rect x="290" y="580" width="880" height="200" rx="30" fill="white" filter="url(#shadow)"/>
  <text x="320" y="615" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2F3E46">Recent Active Schedules</text>
  
  <!-- Table Header -->
  <text x="320" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Patient Name</text>
  <text x="500" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Assigned Doctor</text>
  <text x="700" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Room</text>
  <text x="850" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Time</text>
  <text x="1000" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#84A98C">Status</text>
  
  <rect x="320" y="665" width="820" height="1" fill="#F0F4F2"/>

  <!-- Table Row 1 -->
  <text x="320" y="700" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">John Doe</text>
  <text x="500" y="700" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Dr. Alice Vance</text>
  <text x="700" y="700" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Therapy Room 02</text>
  <text x="850" y="700" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">10:30 AM</text>
  <rect x="1000" y="682" width="80" height="24" rx="12" fill="#52796F" fill-opacity="0.1"/>
  <text x="1015" y="698" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#52796F">In Session</text>

  <!-- Table Row 2 -->
  <text x="320" y="745" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Jane Smith</text>
  <text x="500" y="745" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Dr. Robert Miles</text>
  <text x="700" y="745" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">Consultation B</text>
  <text x="850" y="745" font-family="Arial, sans-serif" font-size="14" fill="#2F3E46">11:45 AM</text>
  <rect x="1000" y="727" width="80" height="24" rx="12" fill="#CAD2C5"/>
  <text x="1015" y="743" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2F3E46">Waiting</text>

  <!-- Shadow Filter Definition -->
  <defs>
    <filter id="shadow" x="0" y="0" width="1200" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#2F3E46" flood-opacity="0.05"/>
    </filter>
  </defs>
</svg>